  <script>
    // Aplica el tema guardado antes de pintar para evitar un destello.
    try {
      var s = JSON.parse(localStorage.getItem('ingles-input:v1') || '{}').settings || {};

      if (typeof s.fontScale === 'number') document.documentElement.style.setProperty('--fs', s.fontScale);
    } catch (e) { /* sin almacenamiento */ }
  </script>
