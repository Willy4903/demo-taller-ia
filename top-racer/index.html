<script>
"use strict";

/* =============================================================================
   TOP RACER · 16-BIT GRAND PRIX
   Juego de carreras pseudo-3D (técnica clásica por segmentos) en un solo archivo.
   Sin librerías ni recursos externos: todo el arte y el sonido se generan por código.

   Estructura general:
     init()          -> prepara canvas, entrada, progreso y arranca el bucle
     handleInput()   -> teclado, ratón y pantalla táctil
     update(dt)      -> lógica según la máquina de estados (game.screen)
     draw()          -> dibuja la pantalla activa
   Estados: title · worlds · tracks · countdown · race · paused · results
   ============================================================================= */

// ─────────────────────────────── 1. CONFIGURACIÓN ────────────────────────────
const SEGMENT_LENGTH = 200;               // largo de cada segmento de pista
const ROAD_WIDTH = 2000;                  // media anchura de la pista (unidades de mundo)
const CAM_HEIGHT = 1000;                  // altura de la cámara
const CAM_DEPTH = 0.84;                   // profundidad de cámara (≈ FOV de 100°)
const CAM_DIST_OPTIONS = [700, 950, 1250]; // distancia cámara-coche: cercana, media, lejana
const CAM_DIST_LABELS = ["CERCANA", "MEDIA", "LEJANA"];
const RUMBLE_LENGTH = 3;                  // segmentos por franja de piano / corte de césped

const SPEED_SCALE = 38;                   // 1 mph = 38 unidades de mundo por segundo
const MAX_MPH = 320, TURBO_MPH = 430, OFFROAD_MPH = 90;
const MAX_SPEED = MAX_MPH * SPEED_SCALE;
const TURBO_SPEED = TURBO_MPH * SPEED_SCALE;
const OFFROAD_SPEED = OFFROAD_MPH * SPEED_SCALE;
const ACCEL = MAX_SPEED / 5;              // de 0 al tope en unos 5 s
const BRAKING = MAX_SPEED / 1.3;
const DECEL = MAX_SPEED / 6;              // frenado natural al soltar el acelerador
const OFFROAD_DECEL = MAX_SPEED / 1.1;    // frenazo brusco al pisar el césped
const OVERSPEED_DECAY = MAX_SPEED / 2.2;  // bajada suave si se superó el tope (fin del turbo)
const TURBO_TIME = 2.5, TURBO_CHARGES = 3, TURBO_ACCEL = 2.4;
const CENTRIFUGAL = 0.17;                 // empuje hacia fuera en curvas (∝ curve · v²)
const STEER_MIN = 0.35, STEER_GAIN = 2.6; // a mayor velocidad, giro más brusco
const CAR_WORLD_W = 600;                  // ancho de un coche en unidades de mundo
const START_INDEX = 16;                   // segmento de la línea de salida
const LAPS = 3;                           // vueltas por carrera
const PAD_BOOST_TIME = 1.4;               // duración del impulso de una zona de turbo

const WEATHER_GRIP = { clear: 1, rain: 0.75, hail: 0.65, snow: 0.7, fog: 1 };
const HOUR_LABEL = { day: "DÍA", sunset: "ATARDECER", night: "NOCHE" };
const WEATHER_LABEL = { clear: "DESPEJADO", rain: "LLUVIA", hail: "GRANIZO", snow: "NIEVE", fog: "NIEBLA" };
const FONT_UI = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const FONT_MONO = '"Courier New", Courier, monospace';
const FONT_TITLE = 'Impact, "Arial Black", "Arial Narrow", Arial, sans-serif';

// ─────────────────────────────── 2. UTILIDADES ───────────────────────────────
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeIn(a, b, t) { return a + (b - a) * t * t; }
function easeInOut(a, b, t) { return a + (b - a) * (0.5 - Math.cos(t * Math.PI) / 2); }

// Generador pseudoaleatorio con semilla (mulberry32): mismas pistas siempre.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const _rgbCache = new Map();
function rgbOf(hex) {
  let c = _rgbCache.get(hex);
  if (!c) {
    const n = parseInt(hex.slice(1), 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    _rgbCache.set(hex, c);
  }
  return c;
}
function toHex(r, g, b) { return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1); }
// Mezcla dos colores hex (t = 0 → a, t = 1 → b). Se usa para la bruma por distancia.
function mix(a, b, t) {
  if (t <= 0) return a;
  if (t >= 1) return b;
  const A = rgbOf(a), B = rgbOf(b);
  return toHex((A[0] + (B[0] - A[0]) * t) | 0, (A[1] + (B[1] - A[1]) * t) | 0, (A[2] + (B[2] - A[2]) * t) | 0);
}
function rgba(hex, a) { const c = rgbOf(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fmtTime(t) {
  t = Math.max(0, t);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}:${String(cs).padStart(2, "0")}`;
}
function ordinal(n) { return n + (n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"); }
function roundRect(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function qb(a, b, c, t) { return (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c; }
function qbd(a, b, c, t) { return 2 * (1 - t) * (b - a) + 2 * t * (c - b); }

// ─────────────────────────────── 3. CANVAS RESPONSIVE ────────────────────────
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 960, H = 540, DPR = 1, UI = 1;
let qualityLevel = 0; // sube si el equipo no llega a ~60 fps (reduce resolución y distancia)
const QUALITY_SCALE = [1, 0.8, 0.65, 0.5];      // factor sobre devicePixelRatio (mínimo 1)
const QUALITY_DISTANCE = [1, 0.9, 0.8, 0.7];     // factor sobre la distancia de dibujo

// Usa clientWidth/clientHeight del documento (funciona dentro de iframes).
function resizeCanvas() {
  const de = document.documentElement;
  const cw = Math.max(1, de.clientWidth || window.innerWidth || 960);
  const ch = Math.max(1, de.clientHeight || window.innerHeight || 540);
  const deviceDpr = Math.min(2, window.devicePixelRatio || 1);
  DPR = Math.max(1, deviceDpr * QUALITY_SCALE[qualityLevel]);
  W = cw; H = ch;
  UI = clamp(Math.min(W / 960, H / 560), 0.6, 1.6);
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
  const pw = Math.max(1, Math.round(cw * DPR)), ph = Math.max(1, Math.round(ch * DPR));
  if (canvas.width !== pw) canvas.width = pw;
  if (canvas.height !== ph) canvas.height = ph;
  Weather.reset();
}

// ─────────────────────────────── 4. SONIDO (Web Audio API) ───────────────────
const Sfx = (() => {
  let ac = null, master = null, eng = null, amb = null, noiseBuf = null, lastOffroad = 0;

  function audio() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.5;
        master.connect(ac.destination);
      }
      if (ac.state === "suspended") ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function noiseBuffer() {
    if (noiseBuf) return noiseBuf;
    const len = ac.sampleRate * 2;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function tone(freq, dur, type, vol, delay, slideTo) {
    try {
      const a = audio(); if (!a) return;
      const t0 = a.currentTime + (delay || 0);
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) { /* sin sonido */ }
  }
  function noise(dur, type, freq, vol, delay, freqTo) {
    try {
      const a = audio(); if (!a) return;
      const t0 = a.currentTime + (delay || 0);
      const s = a.createBufferSource(); s.buffer = noiseBuffer();
      const f = a.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0);
      if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur);
      const g = a.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t0, Math.random()); s.stop(t0 + dur + 0.03);
    } catch (e) { /* sin sonido */ }
  }

  return {
    unlock() { audio(); },
    menu() { tone(740, 0.06, "square", 0.05); },
    select() { tone(880, 0.07, "square", 0.06); tone(1320, 0.1, "square", 0.05, 0.07); },
    deny() { tone(150, 0.2, "sawtooth", 0.06); },
    count(go) { if (go) tone(1046, 0.5, "square", 0.09); else tone(523, 0.22, "square", 0.08); },
    whoosh() { noise(0.75, "bandpass", 260, 0.4, 0, 3600); tone(170, 0.6, "sawtooth", 0.05, 0, 700); },
    crash() { noise(0.35, "lowpass", 1000, 0.5, 0, 120); tone(110, 0.25, "square", 0.07, 0, 45); },
    offroad() {
      try {
        const a = audio(); if (!a) return;
        if (a.currentTime - lastOffroad < 0.12) return;
        lastOffroad = a.currentTime;
        noise(0.14, "lowpass", 500, 0.25);
      } catch (e) { /* sin sonido */ }
    },
    fanfare(win) {
      const seq = win
        ? [[523, 0], [659, 0.14], [784, 0.28], [1046, 0.42], [784, 0.62], [1046, 0.76], [1318, 0.9]]
        : [[392, 0], [349, 0.22], [311, 0.44], [262, 0.7]];
      for (const [f, d] of seq) tone(f, win ? 0.22 : 0.32, "square", 0.07, d);
    },
    engineStart() {
      try {
        const a = audio(); if (!a || eng) return;
        const o1 = a.createOscillator(), o2 = a.createOscillator();
        const f = a.createBiquadFilter(), g = a.createGain();
        o1.type = "sawtooth"; o2.type = "square";
        o1.frequency.value = 55; o2.frequency.value = 27.5;
        f.type = "lowpass"; f.frequency.value = 600;
        g.gain.value = 0.0001;
        o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
        o1.start(); o2.start();
        g.gain.setTargetAtTime(0.05, a.currentTime, 0.1);
        eng = { o1, o2, f, g };
      } catch (e) { /* sin sonido */ }
    },
    engineUpdate(ratio, turbo) {
      try {
        if (!eng) return;
        const t = ac.currentTime;
        const base = 48 + ratio * 175 + (turbo ? 45 : 0);
        eng.o1.frequency.setTargetAtTime(base, t, 0.05);
        eng.o2.frequency.setTargetAtTime(base / 2, t, 0.05);
        eng.f.frequency.setTargetAtTime(450 + ratio * 1700, t, 0.08);
        eng.g.gain.setTargetAtTime(0.035 + ratio * 0.05, t, 0.08);
      } catch (e) { /* sin sonido */ }
    },
    engineStop() {
      try {
        if (!eng) return;
        const e = eng; eng = null;
        e.g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.08);
        setTimeout(() => { try { e.o1.stop(); e.o2.stop(); } catch (x) { /* ya parado */ } }, 400);
      } catch (e) { /* sin sonido */ }
    },
    ambientStart(kind) {
      try {
        this.ambientStop();
        if (kind !== "hail" && kind !== "snow") return;
        const a = audio(); if (!a) return;
        const s = a.createBufferSource(); s.buffer = noiseBuffer(); s.loop = true;
        const f = a.createBiquadFilter(), g = a.createGain();
        if (kind === "hail") { f.type = "bandpass"; f.frequency.value = 2600; f.Q.value = 0.8; g.gain.value = 0.1; }
        else { f.type = "lowpass"; f.frequency.value = 420; g.gain.value = 0.05; }
        s.connect(f); f.connect(g); g.connect(master); s.start();
        amb = { s, g, kind };
      } catch (e) { /* sin sonido */ }
    },
    ambientTick(dt) {
      try {
        if (amb && amb.kind === "hail" && Math.random() < dt * 12) tone(2200 + Math.random() * 1800, 0.03, "square", 0.018);
      } catch (e) { /* sin sonido */ }
    },
    ambientStop() {
      try {
        if (!amb) return;
        const x = amb; amb = null;
        x.g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.15);
        setTimeout(() => { try { x.s.stop(); } catch (e) { /* ya parado */ } }, 500);
      } catch (e) { /* sin sonido */ }
    },
    stopAll() { this.engineStop(); this.ambientStop(); },
  };
})();

// ─────────────────────────────── 5. SPRITES PRERENDERIZADOS ──────────────────
// Cada sprite se dibuja UNA vez en un canvas fuera de pantalla en alta resolución
// y luego se escala con drawImage (imageSmoothingQuality = 'high').
const spriteCache = new Map();
function makeSprite(key, w, h, draw) {
  let c = spriteCache.get(key);
  if (c) return c;
  c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = "high";
  draw(g, w, h);
  spriteCache.set(key, c);
  return c;
}
// Variante tintada de un sprite (noche, niebla, atardecer...). También se cachea.
function tintedSprite(key, img, tint, strength) {
  if (!tint) return img;
  const amount = tint[1] * (strength == null ? 1 : strength);
  if (amount <= 0.001) return img;
  const k = `${key}|${tint[0]}|${amount.toFixed(3)}`;
  let c = spriteCache.get(k);
  if (c) return c;
  c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = "source-atop";
  g.fillStyle = rgba(tint[0], amount);
  g.fillRect(0, 0, c.width, c.height);
  spriteCache.set(k, c);
  return c;
}
function softShadow(g, cx, cy, rx, ry, alpha) {
  g.save();
  g.translate(cx, cy);
  g.scale(1, ry / rx);
  const sg = g.createRadialGradient(0, 0, rx * 0.05, 0, 0, rx);
  sg.addColorStop(0, `rgba(0,0,0,${alpha})`);
  sg.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = sg;
  g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fill();
  g.restore();
}

// ---- 5.1 Coches vistos desde atrás ----
// Carrocería con curvas (caderas anchas sobre las ruedas, hombros, habitáculo
// que se estrecha hacia el techo), luneta con reflejos, pilotos que siguen la
// forma del coche, difusor, escapes cromados y alerones con perfil de ala.
const CAR_MODELS = {
  // GT plateado con franjas y alerón (jugador)
  player: { body: "#c9d1d9", dark: "#56606b", light: "#ffffff", lights: "twin", wing: "gt", plate: "TR-16", roof: 0.75, deck: 0.51, cabin: 0.17, hip: 0.53, exhaust: "twin", stripe: "#1c2f5a", dot: "#ffffff" },
  // superdeportivo rojo, bajo y ancho, con tira de luz y rejilla sobre el motor
  red: { body: "#d9281c", dark: "#5a0905", light: "#ffa090", lights: "strip", wing: "none", plate: "RS-01", roof: 0.68, deck: 0.46, cabin: 0.19, hip: 0.54, exhaust: "center", louvers: true, dot: "#ff4a3a" },
  // coupé azul con pilotos redondos y cola de pato
  blue: { body: "#1f6fd1", dark: "#082a5e", light: "#a8d0ff", lights: "round", wing: "lip", plate: "CP-22", roof: 0.76, deck: 0.51, cabin: 0.16, hip: 0.52, exhaust: "twin", dot: "#3f9bff" },
  // rally amarillo con alerón alto, faldillas y toma de techo
  yellow: { body: "#f2c21a", dark: "#6e5200", light: "#fff6c0", lights: "tall", wing: "rally", plate: "RL-77", roof: 0.8, deck: 0.53, cabin: 0.18, hip: 0.52, exhaust: "twin", stripe: "#151515", flaps: true, scoop: true, dot: "#ffd23a" },
  // GT verde con franjas blancas
  green: { body: "#17a65b", dark: "#043f1e", light: "#9ff5c4", lights: "round", wing: "gt", plate: "GR-08", roof: 0.75, deck: 0.51, cabin: 0.17, hip: 0.53, exhaust: "twin", stripe: "#f2f2f2", dot: "#3ddc7a" },
  // superdeportivo naranja
  orange: { body: "#ff7a1a", dark: "#6b2500", light: "#ffc896", lights: "strip", wing: "lip", plate: "OR-44", roof: 0.69, deck: 0.47, cabin: 0.19, hip: 0.54, exhaust: "center", louvers: true, dot: "#ff9a3a" },
  // coupé morado con cuatro escapes
  purple: { body: "#7b3cff", dark: "#260c66", light: "#d2b4ff", lights: "twin", wing: "lip", plate: "PR-12", roof: 0.75, deck: 0.5, cabin: 0.17, hip: 0.53, exhaust: "quad", dot: "#b07cff" },
  // GT negro con franjas doradas
  black: { body: "#2c3039", dark: "#08090c", light: "#9aa4b6", lights: "twin", wing: "gt", plate: "BK-99", roof: 0.74, deck: 0.5, cabin: 0.17, hip: 0.53, exhaust: "quad", stripe: "#d4a017", dot: "#9aa4b5" },
};
// Posiciones de pilotos (x relativa al ancho, y relativa al alto desde el suelo) para halos de luz.
const TAIL_POS = {
  twin: [[-0.36, 0.41], [0.36, 0.41]],
  strip: [[-0.34, 0.428], [0, 0.432], [0.34, 0.428]],
  round: [[-0.37, 0.405], [-0.265, 0.405], [0.265, 0.405], [0.37, 0.405]],
  tall: [[-0.445, 0.385], [0.445, 0.385]],
};
const EXHAUST_POS = [[-0.19, 0.115], [0.19, 0.115]];
const CAR_GROUND = 0.07; // fracción de la altura del sprite bajo la línea del suelo

function drawCarSprite(g, w, h, m) {
  const cx = w / 2, gy = h * (1 - CAR_GROUND);
  const X = (f) => cx + f * w;      // f en fracciones del ancho desde el centro
  const Y = (f) => gy - f * h;      // f en fracciones del alto desde el suelo
  const k = w / 560;                // escala de grosores de línea
  const deck = m.deck, roof = m.roof, cab = m.cabin, hip = m.hip;
  const moveTo = (fx, fy) => g.moveTo(X(fx), Y(fy));
  const lineTo = (fx, fy) => g.lineTo(X(fx), Y(fy));
  const bez = (ax, ay, bx, by, ex, ey) => g.bezierCurveTo(X(ax), Y(ay), X(bx), Y(by), X(ex), Y(ey));
  const quadTo = (ax, ay, ex, ey) => g.quadraticCurveTo(X(ax), Y(ay), X(ex), Y(ey));

  // --- sombra en el suelo ---
  softShadow(g, cx, gy - h * 0.005, w * 0.54, h * 0.08, 0.62);
  softShadow(g, X(-0.39), gy, w * 0.1, h * 0.025, 0.7);
  softShadow(g, X(0.39), gy, w * 0.1, h * 0.025, 0.7);

  // --- neumáticos (bajo los pasos de rueda) ---
  for (const sd of [-1, 1]) {
    const x0 = sd < 0 ? X(-0.46) : X(0.335), tw = w * 0.125, ty = Y(0.28), th = Y(0.0) - Y(0.28);
    const tg = g.createLinearGradient(x0, 0, x0 + tw, 0);
    tg.addColorStop(0, "#050505"); tg.addColorStop(0.35, "#262626"); tg.addColorStop(0.65, "#1c1c1c"); tg.addColorStop(1, "#040404");
    g.fillStyle = tg; roundRect(g, x0, ty, tw, th, w * 0.032); g.fill();
    g.strokeStyle = "rgba(255,255,255,0.07)"; g.lineWidth = 2.5 * k;
    for (let yy = ty + 10 * k; yy < ty + th - 6 * k; yy += 9 * k) {
      g.beginPath(); g.moveTo(x0 + 6 * k, yy); g.quadraticCurveTo(x0 + tw / 2, yy + 4 * k, x0 + tw - 6 * k, yy); g.stroke();
    }
    // flanco
    g.fillStyle = "rgba(255,255,255,0.06)";
    g.fillRect(sd < 0 ? x0 + 3 * k : x0 + tw - 9 * k, ty + 8 * k, 6 * k, th - 16 * k);
  }

  // --- carrocería: caderas, hombros y tapa del maletero ---
  const bodyPath = () => {
    g.beginPath();
    moveTo(-0.42, 0.1);
    bez(-hip - 0.02, 0.12, -hip - 0.015, 0.24, -hip, 0.33);
    bez(-hip + 0.01, 0.41, -hip + 0.03, deck - 0.04, -hip + 0.07, deck);

function drawCrown(g, rng, cx, cy, rx, ry, count, pal, rMin, rMax, texture) {
  const blobs = [];
  for (let i = 0; i < count; i++) {
    const a = rng() * Math.PI * 2, r = Math.sqrt(rng());
    blobs.push({ x: cx + Math.cos(a) * r * rx, y: cy + Math.sin(a) * r * ry, r: rMin + rng() * (rMax - rMin) });
  }
  blobs.sort((p, q) => p.y - q.y);
  for (const b of blobs) {
    const gr = g.createRadialGradient(b.x - b.r * 0.38, b.y - b.r * 0.45, b.r * 0.08, b.x, b.y, b.r);
    gr.addColorStop(0, pal[0]); gr.addColorStop(0.55, pal[1]); gr.addColorStop(1, pal[2]);
    g.fillStyle = gr; g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
  }
  // textura de hojas: puntitos claros arriba-izquierda, oscuros abajo-derecha
  for (let i = 0; i < texture; i++) {
    const b = blobs[(rng() * blobs.length) | 0];
    const a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * b.r * 0.92;
    const x = b.x + Math.cos(a) * r, y = b.y + Math.sin(a) * r;
    const lit = (x - b.x) + (y - b.y) < 0;
    g.fillStyle = lit ? rgba(pal[0], 0.55) : rgba(pal[2], 0.45);
    g.beginPath(); g.ellipse(x, y, b.r * 0.09, b.r * 0.05, rng() * Math.PI, 0, Math.PI * 2); g.fill();
  }
  return blobs;
}

function drawTree(g, w, h, season, variant) {
  const rng = mulberry32(101 + variant * 37 + season.length * 7);
  const pal = (TREE_PALETTES[season] || TREE_PALETTES.summer)[variant % 3];
  const cx = w / 2, gy = h * 0.975;
  softShadow(g, cx, gy, w * 0.4, h * 0.035, 0.45);
  const tg = g.createLinearGradient(cx - w * 0.06, 0, cx + w * 0.06, 0);
  tg.addColorStop(0, "#3b2616"); tg.addColorStop(0.45, "#7c5836"); tg.addColorStop(1, "#2c1b0e");
  g.fillStyle = tg;
  g.beginPath();
  g.moveTo(cx - w * 0.065, gy); g.lineTo(cx - w * 0.035, h * 0.45);
  g.lineTo(cx + w * 0.035, h * 0.45); g.lineTo(cx + w * 0.065, gy);
  g.closePath(); g.fill();
  g.strokeStyle = "#4a3120"; g.lineWidth = w * 0.025;
  g.beginPath(); g.moveTo(cx, h * 0.55); g.lineTo(cx - w * 0.16, h * 0.4);
  g.moveTo(cx, h * 0.5); g.lineTo(cx + w * 0.15, h * 0.36); g.stroke();
  drawCrown(g, rng, cx, h * 0.36, w * 0.3, h * 0.2, 15 + variant * 2, pal, w * 0.11, w * 0.2, 520);
}

function drawPine(g, w, h, snowy, variant) {
  const cx = w / 2, gy = h * 0.98;
  softShadow(g, cx, gy, w * 0.42, h * 0.03, 0.45);
  g.fillStyle = "#4a3320"; g.fillRect(cx - w * 0.045, h * 0.8, w * 0.09, h * 0.18);
  const layers = 5 + variant;
  for (let i = 0; i < layers; i++) {
    const t = i / (layers - 1);
    const top = lerp(h * 0.03, h * 0.46, t), bottom = lerp(h * 0.26, h * 0.86, t), half = lerp(w * 0.16, w * 0.47, t);
    const gr = g.createLinearGradient(cx - half, 0, cx + half, 0);
    gr.addColorStop(0, "#245f30"); gr.addColorStop(0.45, "#2f7c3c"); gr.addColorStop(1, "#0f3317");
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(cx, top); g.lineTo(cx + half, bottom);
    const n = 8;
    for (let k = 1; k <= n; k++) {
      const x = cx + half - (2 * half * k) / n;
      g.lineTo(x + half / n, bottom - h * 0.035);
      g.lineTo(x, bottom);
    }
    g.closePath(); g.fill();
    if (snowy) {
      const sy = lerp(top, bottom, 0.5), sh = half * 0.5;
      g.fillStyle = "#f4f8ff";
      g.beginPath(); g.moveTo(cx, top); g.lineTo(cx + sh, sy);
      for (let k = 1; k <= 6; k++) {
        const x = cx + sh - (2 * sh * k) / 6;
        g.lineTo(x + sh / 6, sy + h * 0.018); g.lineTo(x, sy);
      }
      g.closePath(); g.fill();
      g.fillStyle = "rgba(255,255,255,0.9)";
      for (let k = 0; k <= n; k++) {
        const x = cx - half + (2 * half * k) / n;
        g.beginPath(); g.ellipse(x, bottom - h * 0.008, half / n * 0.8, h * 0.01, 0, 0, Math.PI * 2); g.fill();
      }
    }
  }
}

function drawPalm(g, w, h, variant) {
  const rng = mulberry32(7 + variant * 13);
  const lean = variant === 1 ? -1 : 1;
  const baseX = w * 0.5, gy = h * 0.98;
  const topX = w * (0.5 + 0.1 * lean), topY = h * 0.26;
  const ctrlX = w * (0.5 - 0.12 * lean), ctrlY = h * 0.62;
  softShadow(g, baseX + w * 0.08 * lean, gy, w * 0.36, h * 0.03, 0.4);
  // tronco curvo anillado
  const rings = 26;
  for (let i = 0; i <= rings; i++) {
    const t = i / rings;
    const x = qb(baseX, ctrlX, topX, t), y = qb(gy, ctrlY, topY, t);
    const rw = lerp(w * 0.055, w * 0.032, t);
    const rg = g.createLinearGradient(x - rw, 0, x + rw, 0);
    rg.addColorStop(0, "#4f371e"); rg.addColorStop(0.5, i % 2 ? "#b08c5c" : "#937045"); rg.addColorStop(1, "#402c16");
    g.fillStyle = rg;
    g.beginPath(); g.ellipse(x, y, rw, h * 0.022, 0, 0, Math.PI * 2); g.fill();
  }
  // hojas con foliolos
  const fronds = 9;
  for (let f = 0; f < fronds; f++) {
    const ang = -Math.PI / 2 + (f / (fronds - 1) - 0.5) * Math.PI * 1.75 + (rng() - 0.5) * 0.2;
    const len = w * (0.36 + rng() * 0.1);
    const ex = topX + Math.cos(ang) * len, ey = topY + Math.sin(ang) * len * 0.5 + len * 0.42;
    const mx = topX + Math.cos(ang) * len * 0.55, my = topY + Math.sin(ang) * len * 0.55 - h * 0.035;
    for (let t = 0.08; t <= 1; t += 0.045) {
      const px = qb(topX, mx, ex, t), py = qb(topY, my, ey, t);
      const dx = qbd(topX, mx, ex, t), dy = qbd(topY, my, ey, t);
      const L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
      const ll = w * 0.075 * Math.sin(Math.PI * Math.min(1, t * 1.05)) + w * 0.012;
      g.strokeStyle = (t * 22 | 0) % 2 ? "#2f8a3a" : "#236a2b";
      g.lineWidth = w * 0.011;
      g.beginPath(); g.moveTo(px, py); g.lineTo(px + nx * ll + (dx / L) * ll * 0.4, py + ny * ll + (dy / L) * ll * 0.4 + ll * 0.35); g.stroke();
      g.beginPath(); g.moveTo(px, py); g.lineTo(px - nx * ll + (dx / L) * ll * 0.4, py - ny * ll + (dy / L) * ll * 0.4 + ll * 0.35); g.stroke();
    }
    g.strokeStyle = "#1b5623"; g.lineWidth = w * 0.014;
    g.beginPath(); g.moveTo(topX, topY); g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
  }
  for (let i = 0; i < 4; i++) {
    const x = topX + (i - 1.5) * w * 0.03, y = topY + h * 0.025 + (i % 2) * h * 0.012;
    const cg = g.createRadialGradient(x - 2, y - 2, 1, x, y, w * 0.025);
    cg.addColorStop(0, "#9c7a4a"); cg.addColorStop(1, "#4a3214");
    g.fillStyle = cg; g.beginPath(); g.arc(x, y, w * 0.025, 0, Math.PI * 2); g.fill();
  }
}

function drawBush(g, w, h, season, variant) {
  const rng = mulberry32(55 + variant * 17);
  const pal = BUSH_PALETTES[season] || BUSH_PALETTES.summer;
  softShadow(g, w / 2, h * 0.95, w * 0.46, h * 0.07, 0.45);
  drawCrown(g, rng, w / 2, h * 0.62, w * 0.3, h * 0.18, 9, pal, w * 0.12, w * 0.2, 260);
}

function drawCherry(g, w, h, variant) {
  const rng = mulberry32(303 + variant * 29);
  const cx = w / 2, gy = h * 0.975;
  softShadow(g, cx, gy, w * 0.4, h * 0.035, 0.45);
  g.strokeStyle = "#4a2f22"; g.lineCap = "round";
  g.lineWidth = w * 0.07; g.beginPath(); g.moveTo(cx, gy); g.quadraticCurveTo(cx - w * 0.03, h * 0.6, cx, h * 0.45); g.stroke();
  g.lineWidth = w * 0.03; g.beginPath();
  g.moveTo(cx, h * 0.52); g.lineTo(cx - w * 0.2, h * 0.36);
  g.moveTo(cx, h * 0.5); g.lineTo(cx + w * 0.22, h * 0.34); g.stroke();
  drawCrown(g, rng, cx, h * 0.34, w * 0.32, h * 0.18, 16, ["#fff0f7", "#ffa6cf", "#c4507f"], w * 0.1, w * 0.19, 600);
  for (let i = 0; i < 26; i++) {
    g.fillStyle = i % 2 ? "rgba(255,255,255,0.85)" : "rgba(255,190,220,0.9)";
    g.beginPath(); g.ellipse(cx + (rng() - 0.5) * w * 0.8, h * 0.6 + rng() * h * 0.36, w * 0.012, w * 0.007, rng() * 3, 0, Math.PI * 2); g.fill();
  }
}

function drawFlowers(g, w, h, variant) {
  const rng = mulberry32(909 + variant * 41);
  softShadow(g, w / 2, h * 0.93, w * 0.5, h * 0.12, 0.35);
  const mg = g.createLinearGradient(0, h * 0.35, 0, h);
  mg.addColorStop(0, "#6cc24a"); mg.addColorStop(1, "#2e6b22");
  g.fillStyle = mg;
  g.beginPath(); g.ellipse(w / 2, h * 0.78, w * 0.48, h * 0.34, 0, Math.PI, 0); g.lineTo(w * 0.98, h * 0.95); g.lineTo(w * 0.02, h * 0.95); g.closePath(); g.fill();
  const colors = [["#ff5fa2", "#ffd0e4"], ["#ffe14d", "#fff7c2"], ["#ff7a2e", "#ffd2b0"], ["#b46bff", "#ecd6ff"], ["#ffffff", "#ffffff"]];
  for (let i = 0; i < 70; i++) {
    const a = rng() * Math.PI, r = Math.sqrt(rng());
    const x = w / 2 + Math.cos(a) * r * w * 0.44, y = h * 0.8 - Math.sin(a) * r * h * 0.3;
    const [c1, c2] = colors[(rng() * colors.length) | 0];
    const fr = w * (0.014 + rng() * 0.01);
    for (let p = 0; p < 5; p++) {
      const pa = (p / 5) * Math.PI * 2;
      g.fillStyle = p % 2 ? c1 : c2;
      g.beginPath(); g.arc(x + Math.cos(pa) * fr, y + Math.sin(pa) * fr * 0.8, fr * 0.8, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = "#ffcc2a"; g.beginPath(); g.arc(x, y, fr * 0.6, 0, Math.PI * 2); g.fill();
  }
}

function drawHay(g, w, h, variant) {
  const rng = mulberry32(77 + variant);
  softShadow(g, w / 2, h * 0.93, w * 0.48, h * 0.08, 0.45);
  // cilindro de heno: lateral + cara circular
  const sideGrad = g.createLinearGradient(0, h * 0.2, 0, h * 0.92);
  sideGrad.addColorStop(0, "#f0cf6a"); sideGrad.addColorStop(0.6, "#c9983a"); sideGrad.addColorStop(1, "#7e5a1a");
  g.fillStyle = sideGrad;
  roundRect(g, w * 0.28, h * 0.2, w * 0.66, h * 0.72, h * 0.08); g.fill();
  const fx = w * 0.3, fy = h * 0.56, fr = h * 0.36;
  const fg = g.createRadialGradient(fx - fr * 0.3, fy - fr * 0.3, 2, fx, fy, fr);
  fg.addColorStop(0, "#f7dc86"); fg.addColorStop(1, "#b78a33");
  g.fillStyle = fg; g.beginPath(); g.ellipse(fx, fy, fr * 0.72, fr, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(110,75,20,0.6)"; g.lineWidth = 2;
  g.beginPath();
  for (let a = 0; a < Math.PI * 10; a += 0.2) {
    const rr = (a / (Math.PI * 10)) * fr * 0.95;
    const x = fx + Math.cos(a) * rr * 0.72, y = fy + Math.sin(a) * rr;
    if (a === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();
  g.strokeStyle = "rgba(255,240,180,0.45)"; g.lineWidth = 1.5;
  for (let i = 0; i < 90; i++) {
    const x = w * 0.36 + rng() * w * 0.56, y = h * 0.24 + rng() * h * 0.64;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rng() - 0.5) * 14, y + rng() * 6); g.stroke();
  }
}

function drawSnowman(g, w, h) {
  softShadow(g, w / 2, h * 0.97, w * 0.42, h * 0.035, 0.4);
  const balls = [[w * 0.5, h * 0.78, w * 0.3], [w * 0.5, h * 0.5, w * 0.23], [w * 0.5, h * 0.28, w * 0.17]];
  for (const [bx, by, r] of balls) {
    const gr = g.createRadialGradient(bx - r * 0.35, by - r * 0.4, r * 0.1, bx, by, r);
    gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.7, "#e3edf6"); gr.addColorStop(1, "#9fb4c8");
    g.fillStyle = gr; g.beginPath(); g.arc(bx, by, r, 0, Math.PI * 2); g.fill();
  }
  g.strokeStyle = "#5a3b22"; g.lineWidth = w * 0.025; g.lineCap = "round";
  g.beginPath(); g.moveTo(w * 0.3, h * 0.48); g.lineTo(w * 0.06, h * 0.38);
  g.moveTo(w * 0.7, h * 0.48); g.lineTo(w * 0.94, h * 0.36); g.stroke();
  g.fillStyle = "#d62b2b"; roundRect(g, w * 0.3, h * 0.37, w * 0.4, h * 0.05, 6); g.fill();
  g.fillRect(w * 0.56, h * 0.38, w * 0.08, h * 0.13);
  g.fillStyle = "#1a1a1a";
  g.fillRect(w * 0.34, h * 0.14, w * 0.32, h * 0.03);
  g.fillRect(w * 0.39, h * 0.03, w * 0.22, h * 0.12);
  g.beginPath(); g.arc(w * 0.44, h * 0.26, w * 0.02, 0, Math.PI * 2); g.arc(w * 0.56, h * 0.26, w * 0.02, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(w * 0.5, h * (0.47 + i * 0.07), w * 0.018, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = "#f07a1a";
  g.beginPath(); g.moveTo(w * 0.5, h * 0.29); g.lineTo(w * 0.66, h * 0.305); g.lineTo(w * 0.5, h * 0.315); g.closePath(); g.fill();
}

function drawBillboard(g, w, h, idx) {
  const b = BILLBOARDS[idx % BILLBOARDS.length];
  softShadow(g, w / 2, h * 0.97, w * 0.45, h * 0.03, 0.35);
  for (const px of [0.22, 0.78]) {
    const pg = g.createLinearGradient(w * px - 8, 0, w * px + 8, 0);
    pg.addColorStop(0, "#555"); pg.addColorStop(0.5, "#b8b8b8"); pg.addColorStop(1, "#444");
    g.fillStyle = pg; g.fillRect(w * px - 8, h * 0.5, 16, h * 0.48);
  }
  g.fillStyle = "#e8e8e8"; roundRect(g, w * 0.02, h * 0.08, w * 0.96, h * 0.5, 8); g.fill();
  g.strokeStyle = "#333"; g.lineWidth = 4; g.stroke();
  g.save();
  roundRect(g, w * 0.045, h * 0.11, w * 0.91, h * 0.44, 6); g.clip();
  const bgd = g.createLinearGradient(0, h * 0.11, 0, h * 0.55);
  bgd.addColorStop(0, b.a); bgd.addColorStop(1, b.b);
  g.fillStyle = bgd; g.fillRect(0, 0, w, h);
  g.fillStyle = "rgba(255,255,255,0.12)";
  for (let i = -4; i < 12; i++) { g.beginPath(); g.moveTo(i * w * 0.1, h * 0.55); g.lineTo(i * w * 0.1 + w * 0.05, h * 0.55); g.lineTo(i * w * 0.1 + w * 0.2, h * 0.11); g.lineTo(i * w * 0.1 + w * 0.15, h * 0.11); g.closePath(); g.fill(); }
  g.restore();
  g.font = `italic 900 ${Math.round(h * 0.25)}px ${FONT_TITLE}`;
  g.textAlign = "center"; g.textBaseline = "middle";
  g.lineWidth = 8; g.strokeStyle = "rgba(0,0,0,0.6)"; g.strokeText(b.text, w / 2, h * 0.31);
  g.fillStyle = b.fg; g.fillText(b.text, w / 2, h * 0.31);
  g.font = `bold ${Math.round(h * 0.06)}px ${FONT_UI}`;
  g.fillStyle = "rgba(255,255,255,0.85)"; g.fillText("16-BIT GRAND PRIX", w / 2, h * 0.49);
  for (const px of [0.2, 0.5, 0.8]) {
    g.fillStyle = "#333"; g.fillRect(w * px - 3, h * 0.02, 6, h * 0.06);
    g.fillStyle = "#fff6c8"; g.beginPath(); g.ellipse(w * px, h * 0.03, 10, 5, 0, 0, Math.PI * 2); g.fill();
  }
}

function drawTower(g, w, h) {
  const cx = w / 2, gy = h * 0.99, top = h * 0.2;
  softShadow(g, cx, gy, w * 0.4, h * 0.015, 0.35);
  g.strokeStyle = "#8d949b"; g.lineWidth = w * 0.035; g.lineCap = "round";
  g.beginPath();
  g.moveTo(cx - w * 0.2, gy); g.lineTo(cx - w * 0.05, top);
  g.moveTo(cx + w * 0.2, gy); g.lineTo(cx + w * 0.05, top); g.stroke();
  g.lineWidth = w * 0.014; g.strokeStyle = "#a7aeb5";
  const steps = 12;
  for (let i = 0; i < steps; i++) {
    const y1 = lerp(gy, top, i / steps), y2 = lerp(gy, top, (i + 1) / steps);
    const hw1 = lerp(w * 0.2, w * 0.05, i / steps), hw2 = lerp(w * 0.2, w * 0.05, (i + 1) / steps);
    g.beginPath(); g.moveTo(cx - hw1, y1); g.lineTo(cx + hw2, y2); g.moveTo(cx + hw1, y1); g.lineTo(cx - hw2, y2); g.stroke();
  }
  g.fillStyle = "#2b3036"; roundRect(g, cx - w * 0.42, h * 0.03, w * 0.84, h * 0.17, 6); g.fill();
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 4; c++) {
      const lx = cx - w * 0.3 + c * w * 0.2, ly = h * 0.075 + r * h * 0.075;
      const lg = g.createRadialGradient(lx - 3, ly - 3, 1, lx, ly, w * 0.08);
      lg.addColorStop(0, "#ffffff"); lg.addColorStop(0.5, "#fff1b0"); lg.addColorStop(1, "#8a7a3a");
      g.fillStyle = lg; g.beginPath(); g.arc(lx, ly, w * 0.075, 0, Math.PI * 2); g.fill();
    }
  }
}

// Farola con el brazo hacia la izquierda (se espeja para el otro lado de la pista).
const LAMP_HEAD = [0.2, 0.115];
function drawLamp(g, w, h) {
  softShadow(g, w * 0.78, h * 0.985, w * 0.2, h * 0.012, 0.4);
  const pg = g.createLinearGradient(w * 0.74, 0, w * 0.82, 0);
  pg.addColorStop(0, "#3b4148"); pg.addColorStop(0.5, "#a9b1b9"); pg.addColorStop(1, "#30363c");
  g.fillStyle = pg; g.fillRect(w * 0.74, h * 0.1, w * 0.08, h * 0.89);
  g.fillRect(w * 0.7, h * 0.94, w * 0.16, h * 0.05);
  g.strokeStyle = "#6f7880"; g.lineWidth = w * 0.045; g.lineCap = "round";
  g.beginPath(); g.moveTo(w * 0.78, h * 0.12); g.quadraticCurveTo(w * 0.7, h * 0.06, w * 0.3, h * 0.09); g.stroke();
  g.fillStyle = "#2a2f35"; roundRect(g, w * 0.08, h * 0.08, w * 0.3, h * 0.035, 6); g.fill();
  g.fillStyle = "#fff2c0"; roundRect(g, w * 0.1, h * 0.108, w * 0.26, h * 0.014, 4); g.fill();
}

const DECOR = {
  tree: { w: 1300, cw: 300, ch: 400, variants: 3 },
  pine: { w: 1000, cw: 260, ch: 420, variants: 2 },
  palm: { w: 1400, cw: 320, ch: 460, variants: 3 },
  bush: { w: 850, cw: 260, ch: 170, variants: 2 },
  cherry: { w: 1300, cw: 300, ch: 380, variants: 2 },
  flowers: { w: 1150, cw: 300, ch: 130, variants: 3 },
  hay: { w: 720, cw: 240, ch: 170, variants: 2 },
  snowman: { w: 560, cw: 200, ch: 300, variants: 1 },
  billboard: { w: 1800, cw: 360, ch: 260, variants: 4 },
  tower: { w: 720, cw: 200, ch: 560, variants: 1 },
  lamp: { w: 700, cw: 200, ch: 420, variants: 1 },
};
function decorSprite(kind, season, variant) {
  const d = DECOR[kind];
  return makeSprite(`decor-${kind}-${season}-${variant}`, d.cw, d.ch, (g, w, h) => {
    switch (kind) {
      case "tree": drawTree(g, w, h, season, variant); break;
      case "pine": drawPine(g, w, h, season === "winter", variant); break;
      case "palm": drawPalm(g, w, h, variant); break;
      case "bush": drawBush(g, w, h, season, variant); break;
      case "cherry": drawCherry(g, w, h, variant); break;
      case "flowers": drawFlowers(g, w, h, variant); break;
      case "hay": drawHay(g, w, h, variant); break;
      case "snowman": drawSnowman(g, w, h); break;
      case "billboard": drawBillboard(g, w, h, variant); break;
      case "tower": drawTower(g, w, h); break;
      case "lamp": drawLamp(g, w, h); break;
    }
  });
}

// ---- 5.3 Iconos (hora, clima y candado) ----
function iconSprite(kind) {
  return makeSprite("icon-" + kind, 96, 96, (g, w) => {
    const s = w;
    g.translate(w / 2, w / 2);
    g.lineCap = "round"; g.lineJoin = "round";
    const cloud = (col) => {
      g.fillStyle = col;
      g.beginPath();
      g.arc(-s * 0.16, -s * 0.06, s * 0.16, 0, Math.PI * 2);
      g.arc(s * 0.04, -s * 0.14, s * 0.2, 0, Math.PI * 2);
      g.arc(s * 0.22, -s * 0.04, s * 0.15, 0, Math.PI * 2);
      g.fill();
      g.fillRect(-s * 0.3, -s * 0.06, s * 0.6, s * 0.14);
    };
    if (kind === "day") {
      g.strokeStyle = "#ffd23a"; g.lineWidth = s * 0.08;
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        g.beginPath(); g.moveTo(Math.cos(a) * s * 0.3, Math.sin(a) * s * 0.3); g.lineTo(Math.cos(a) * s * 0.44, Math.sin(a) * s * 0.44); g.stroke();
      }
      g.fillStyle = "#ffd23a"; g.beginPath(); g.arc(0, 0, s * 0.2, 0, Math.PI * 2); g.fill();
    } else if (kind === "sunset") {
      g.strokeStyle = "#ffb24a"; g.lineWidth = s * 0.07;
      for (let i = 0; i < 5; i++) {
        const a = Math.PI + (i + 0.5) * (Math.PI / 5);
        g.beginPath(); g.moveTo(Math.cos(a) * s * 0.3, s * 0.1 + Math.sin(a) * s * 0.3); g.lineTo(Math.cos(a) * s * 0.42, s * 0.1 + Math.sin(a) * s * 0.42); g.stroke();
      }
      g.fillStyle = "#ff7a2a"; g.beginPath(); g.arc(0, s * 0.1, s * 0.22, Math.PI, 0); g.fill();
      g.strokeStyle = "#ffd08a"; g.lineWidth = s * 0.06;
      g.beginPath(); g.moveTo(-s * 0.42, s * 0.14); g.lineTo(s * 0.42, s * 0.14); g.stroke();
    } else if (kind === "night") {
      g.fillStyle = "#eef0ff"; g.beginPath(); g.arc(0, 0, s * 0.3, 0, Math.PI * 2); g.fill();
      g.globalCompositeOperation = "destination-out";
      g.beginPath(); g.arc(s * 0.15, -s * 0.1, s * 0.26, 0, Math.PI * 2); g.fill();
      g.globalCompositeOperation = "source-over";
      g.fillStyle = "#fff"; g.fillRect(s * 0.2, s * 0.14, 4, 4); g.fillRect(s * 0.3, -s * 0.3, 3, 3);
    } else if (kind === "rain") {
      cloud("#c9d2dc");
      g.strokeStyle = "#5fb0ff"; g.lineWidth = s * 0.06;
      for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * s * 0.16, s * 0.16); g.lineTo(i * s * 0.16 - s * 0.06, s * 0.36); g.stroke(); }
    } else if (kind === "hail") {
      cloud("#b9c4cf");
      g.fillStyle = "#ffffff"; g.strokeStyle = "#8fb5dd"; g.lineWidth = 2;
      for (const [x, y] of [[-0.18, 0.26], [0.02, 0.34], [0.2, 0.24]]) { g.beginPath(); g.arc(x * s, y * s, s * 0.06, 0, Math.PI * 2); g.fill(); g.stroke(); }
    } else if (kind === "snow") {
      g.strokeStyle = "#dff0ff"; g.lineWidth = s * 0.06;
      for (let i = 0; i < 3; i++) {
        const a = (i * Math.PI) / 3;
        g.beginPath(); g.moveTo(Math.cos(a) * s * 0.34, Math.sin(a) * s * 0.34); g.lineTo(-Math.cos(a) * s * 0.34, -Math.sin(a) * s * 0.34); g.stroke();
      }
      g.fillStyle = "#dff0ff"; g.beginPath(); g.arc(0, 0, s * 0.07, 0, Math.PI * 2); g.fill();
    } else if (kind === "fog") {
      g.strokeStyle = "#cfd6de"; g.lineWidth = s * 0.07;
      for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(-s * 0.36 + (i & 1) * s * 0.08, i * s * 0.16); g.lineTo(s * 0.36 - (i & 1) * s * 0.04, i * s * 0.16); g.stroke(); }
    } else if (kind === "lock") {
      g.strokeStyle = "#e6e9ee"; g.lineWidth = s * 0.08;
      g.beginPath(); g.arc(0, -s * 0.08, s * 0.18, Math.PI, 0); g.lineTo(s * 0.18, s * 0.02); g.moveTo(-s * 0.18, -s * 0.08); g.lineTo(-s * 0.18, s * 0.02); g.stroke();
      const lg = g.createLinearGradient(0, 0, 0, s * 0.38);
      lg.addColorStop(0, "#ffd65a"); lg.addColorStop(1, "#b88a12");
      g.fillStyle = lg; roundRect(g, -s * 0.28, 0, s * 0.56, s * 0.38, s * 0.06); g.fill();
      g.fillStyle = "#5a4000"; g.beginPath(); g.arc(0, s * 0.15, s * 0.06, 0, Math.PI * 2); g.fill();
      g.fillRect(-s * 0.025, s * 0.15, s * 0.05, s * 0.12);
    }
  });
}
function drawIcon(kind, x, y, size) {

}

// Paleta final de una pista según mundo, hora y clima.
function buildTheme(world, hour, weather) {
  const overcast = weather !== "clear";
  const night = hour === "night";
  const tintColor = night ? "#060818" : hour === "sunset" ? "#ff7a3a" : null;
  const tintAmt = night ? 0.62 : 0.13;
  const T = (c) => {
    let r = c;
    if (overcast) r = mix(r, "#8a9099", weather === "fog" ? 0.28 : 0.16);
    if (tintColor) r = mix(r, tintColor, tintAmt);
    return r;
  };
  let sky = world.sky[hour].slice();
  if (overcast && !night) sky = [mix(sky[0], "#6c7786", 0.55), mix(sky[1], "#b9c0ca", 0.55)];
  if (weather === "fog") sky = night ? ["#0a0d15", "#2a303b"] : ["#a6b0bb", "#d4d9df"];
  const wet = weather === "rain";
  // Asfalto mojado: más oscuro y con menos contraste entre franjas
  const road = wet
    ? [mix(T(world.road[0]), "#000000", 0.3), mix(mix(T(world.road[1]), T(world.road[0]), 0.6), "#000000", 0.3)]
    : world.road.map(T);
  let fog = sky[1];
  if (night) fog = mix(sky[1], "#000000", 0.35);
  if (weather === "fog") fog = night ? "#262b35" : "#cdd2d8";
  const dense = weather === "fog";
  // Tinte para los sprites prerenderizados según la luz ambiente
  let spriteTint = null;
  if (night) spriteTint = ["#0a1030", 0.52];
  else if (dense) spriteTint = [fog, 0.2];
  else if (hour === "sunset") spriteTint = ["#ff7a3a", 0.12];
  else if (overcast) spriteTint = ["#7d8591", 0.12];
  return {
    season: world.id,
    sky, fog, spriteTint,
    grass: world.grass.map(T), shoulder: T(world.shoulder), road,
    wear: mix(road[0], "#000000", wet ? 0.06 : 0.14),
    sheen: wet ? mix(road[0], night ? "#8a90b0" : "#c9d6e6", 0.13) : null,
    rumble: world.rumble.map(T),
    lane: night ? "#b9bcc8" : T("#f1f1f1"),
    mountains: world.mountains.map((c, i) => mix(T(c), fog, (dense ? [0.9, 0.82, 0.7] : [0.55, 0.3, 0.12])[i])),
    snowCaps: world.snowCaps,
    snowColor: dense ? mix(T("#ffffff"), fog, 0.8) : T("#ffffff"),
    treeline: mix(T(world.treeline), fog, dense ? 0.8 : 0.25),
  };
}

// Plan ligero de pista (curvas + trazado del minimapa). Se cachea.
const planCache = new Map();
function trackPlan(w, t) {
  const key = w * 10 + t;
  if (planCache.has(key)) return planCache.get(key);
  const rng = mulberry32(0x9E3779B1 ^ (key * 7919 + 17));
  const difficulty = key / 39;
  // Largo de UNA vuelta (el circuito se recorre LAPS veces)
  const target = Math.round(620 + w * 150 + t * 55 + (t === 9 ? 140 : 0));
  const curves = [];
  const push = (n, c) => { for (let i = 0; i < n; i++) curves.push(c); };
  // Curva con entrada y salida suaves
  const addCurve = (len, c) => {
    const e = Math.max(6, Math.floor(len * 0.25)), l = Math.max(6, Math.floor(len * 0.25)), hold = Math.max(4, len - e - l);
    for (let i = 0; i < e; i++) curves.push(easeIn(0, c, i / e));
    push(hold, c);
    for (let i = 0; i < l; i++) curves.push(easeInOut(c, 0, i / l));
  };
  push(START_INDEX + 40, 0); // recta de salida / meta
  let lastWasCurve = false;
  while (curves.length < target) {
    if (lastWasCurve && rng() < 0.55) {
      push(Math.round(lerp(72, 28, difficulty) + rng() * 46), 0);
      lastWasCurve = false;
      continue;
    }
    const dir = rng() < 0.5 ? -1 : 1;
    const mag = 1.2 + rng() * 2.2 + difficulty * 4.3;
    const len = Math.round(44 + rng() * 76 + difficulty * 34);
    if (rng() < 0.25 + difficulty * 0.2) {
      addCurve(Math.round(len * 0.6), dir * mag);
      addCurve(Math.round(len * 0.6), -dir * mag * 0.9);
    } else {
      addCurve(len, dir * mag);
    }
    lastWasCurve = true;
  }
  push(30, 0); // recta que empalma con la salida (el circuito es cerrado)
  const lapSegments = curves.length;

  // Zonas de turbo: franjas con flechas en las rectas; al cruzarlas dan un impulso.
  const pads = [];
  const wanted = 3 + (t === 9 ? 1 : 0);
  const minGap = Math.floor(lapSegments / (wanted + 1));
  let lastPad = START_INDEX + 30;
  for (let i = START_INDEX + 70; i < lapSegments - 20 && pads.length < wanted; i++) {
    if (i - lastPad < minGap) continue;
    let straight = true;
    for (let k = -4; k < 14; k++) if (Math.abs(curves[i + k] || 0) > 0.35) { straight = false; break; }
    if (!straight) continue;
    pads.push({ start: i, len: 8, c: [-0.55, 0, 0.55][(rng() * 3) | 0], hw: 0.27 });
    lastPad = i;
  }

  // Trazado del minimapa: la curvatura se integra como cambio de rumbo
  // (angulo += curve · 0,0045) y se corrige la deriva para cerrar el circuito.
  const n = lapSegments;
  const shape = new Float32Array(n * 2);
  let ang = 0, x = 0, y = 0;
  for (let i = 0; i < n; i++) {
    ang += curves[(START_INDEX + i) % n] * 0.0045;
    x += Math.sin(ang); y -= Math.cos(ang);
    shape[i * 2] = x; shape[i * 2 + 1] = y;
  }
  const ex = shape[(n - 1) * 2], ey = shape[(n - 1) * 2 + 1];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    shape[i * 2] -= ex * f; shape[i * 2 + 1] -= ey * f;
    minX = Math.min(minX, shape[i * 2]); maxX = Math.max(maxX, shape[i * 2]);
    minY = Math.min(minY, shape[i * 2 + 1]); maxY = Math.max(maxY, shape[i * 2 + 1]);
  }
  const world = WORLDS[w];
  const [hour, weather] = world.conditions[t];
  const lapLength = lapSegments * SEGMENT_LENGTH;
  const raceLength = lapLength * LAPS;
  const plan = {
    w, t, key, name: world.tracks[t], isGP: t === 9, hour, weather, difficulty,
    curves: Float32Array.from(curves), startIndex: START_INDEX, lapSegments, lapLength, raceLength, pads,
    shape, bounds: { minX, maxX, minY, maxY },
    // tiempo límite: largo total a un ritmo de referencia + margen (más justo al avanzar)
    timeLimit: Math.ceil(raceLength / (MAX_SPEED * lerp(0.74, 0.82, difficulty)) + lerp(16, 10, difficulty)),
    rivalBase: 0.7 + difficulty * 0.14,
  };
  planCache.set(key, plan);
  return plan;
}

// Pista completa: segmentos, decoración, pórtico de salida/meta, turbos y colores.
function generateTrack(w, t) {
  const plan = trackPlan(w, t);
  const world = WORLDS[w];
  const theme = buildTheme(world, plan.hour, plan.weather);
  const rng = mulberry32(4242 + plan.key * 131);
  const segments = new Array(plan.lapSegments);
  for (let i = 0; i < plan.lapSegments; i++) {
    segments[i] = {
      index: i, absIndex: i, curve: plan.curves[i],
      band: Math.floor(i / RUMBLE_LENGTH) % 2,
      p1: { x: 0, y: 0, w: 0, scale: 0, cz: 0, wx: 0 },
      p2: { x: 0, y: 0, w: 0, scale: 0, cz: 0, wx: 0 },
      sprites: [], fog: 0, pad: null, padStep: 0,
    };
  }
  for (const pad of plan.pads) {
    for (let k = 0; k < pad.len; k++) { segments[pad.start + k].pad = pad; segments[pad.start + k].padStep = k; }
  }
  // Decoración (pseudoaleatoria con semilla, con variantes y espejado)
  const weights = world.decor, total = weights.reduce((s, d) => s + d[1], 0);
  const pick = () => { let r = rng() * total; for (const [k, wgt] of weights) { r -= wgt; if (r <= 0) return k; } return weights[0][0]; };
  for (let i = 0; i < segments.length; i++) {
    if (i >= plan.startIndex - 3 && i <= plan.startIndex + 3) continue;
    for (const side of [-1, 1]) {
      if (rng() > 0.2) continue;
      const kind = pick();
      const def = DECOR[kind];
      let offset = 1.35 + rng() * 1.7;
      if (kind === "billboard") offset = 1.55 + rng() * 0.5;
      if (kind === "tower") offset = 1.7 + rng() * 0.6;
      if (kind === "flowers" || kind === "bush") offset = 1.3 + rng() * 1.2;
      segments[i].sprites.push({
        kind, variant: (rng() * def.variants) | 0, offset: side * offset,
        flip: kind !== "billboard" && rng() < 0.5,
      });
    }
  }
  // Farolas de noche, a lo largo de todo el circuito
  if (plan.hour === "night") {
    for (let i = 8; i < segments.length; i += 20) {
      const side = (i / 20) % 2 < 1 ? 1 : -1;
      segments[i].sprites.push({ kind: "lamp", variant: 0, offset: side * 1.28, flip: side < 0, lamp: true });
    }
  }
  segments[plan.startIndex].gate = "startfinish";

  let drawDistance = 210;
  if (plan.hour === "sunset") drawDistance = 190;
  if (plan.weather === "rain" || plan.weather === "hail" || plan.weather === "snow") drawDistance = 150;
  if (plan.hour === "night") drawDistance = Math.min(drawDistance, 130);
  if (plan.weather === "fog") drawDistance = 100;

  const startZ = plan.startIndex * SEGMENT_LENGTH;
  return {
    plan, world, theme, segments,
    startIndex: plan.startIndex, lapSegments: plan.lapSegments, lapLength: plan.lapLength,
    startZ, finishZ: startZ + plan.raceLength,
    drawDistance,
  };
}

const SAVE_KEY = "topRacer.progress.v1";
function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p.unlocked === "number" && p.best && typeof p.best === "object") {
        p.unlocked = clamp(p.unlocked | 0, 1, 40);
        if (!p.settings || typeof p.settings !== "object") p.settings = {};
        p.settings.camDist = clamp((p.settings.camDist | 0) || 1, 0, CAM_DIST_OPTIONS.length - 1);
        p.settings.difficulty = clamp(p.settings.difficulty | 0, 0, 1);
        return p;
      }
    }
  } catch (e) { /* localStorage no disponible */ }
  return { unlocked: 1, best: {}, settings: { camDist: 1, difficulty: 0 } };
}

function currentCamDist() { return CAM_DIST_OPTIONS[progress.settings.camDist]; }
