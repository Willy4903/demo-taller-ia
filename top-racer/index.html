// ─────────────────────────────── 8. ENTRADA ──────────────────────────────────
const keys = { left: false, right: false, up: false, down: false };
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
};
const touchPointers = new Map();

function handleInput() {
  window.addEventListener("keydown", (e) => {
    Sfx.unlock();
    const k = KEYMAP[e.code];
    if (k || e.code === "Space") e.preventDefault();
    if (k) keys[k] = true;
    if (e.repeat) return;
    onKeyPress(e.code);
  });
  window.addEventListener("keyup", (e) => {
    const k = KEYMAP[e.code];
    if (k) keys[k] = false;
  });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && game.screen === "race") pauseRace();
  });

  canvas.addEventListener("pointerdown", (e) => {
    Sfx.unlock();
    canvas.focus();
    if (e.pointerType === "touch") game.touchMode = true;
    const x = e.clientX, y = e.clientY;
    if (game.screen === "race" && game.touchMode) {
      const btn = touchButtonAt(x, y);
      if (btn) { touchPointers.set(e.pointerId, btn); applyTouch(); if (btn === "nitro") activateTurbo(); if (btn === "pause") pauseRace(); return; }
    }
    for (let i = game.uiButtons.length - 1; i >= 0; i--) {
      const b = game.uiButtons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.action(); return; }
    }
    if (game.screen === "title") goToWorlds();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!touchPointers.has(e.pointerId)) return;
    const btn = touchButtonAt(e.clientX, e.clientY);
    if (btn && btn !== "nitro" && btn !== "pause") touchPointers.set(e.pointerId, btn);
    applyTouch();
  });
  const release = (e) => { if (touchPointers.delete(e.pointerId)) applyTouch(); };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
}

function onKeyPress(code) {
  const s = game.screen;
  if (s === "title") {
    if (code === "Enter" || code === "Space") goToWorlds();
    else if (code === "KeyO") { game.screen = "options"; Sfx.menu(); }
  } else if (s === "options") {
    if (code === "ArrowUp" || code === "KeyW") { game.optionRow = (game.optionRow - 1 + OPTION_ROWS.length) % OPTION_ROWS.length; Sfx.menu(); }
    else if (code === "ArrowDown" || code === "KeyS") { game.optionRow = (game.optionRow + 1) % OPTION_ROWS.length; Sfx.menu(); }
    else if (code === "ArrowLeft" || code === "KeyA") cycleOption(game.optionRow, -1);
    else if (code === "ArrowRight" || code === "KeyD") cycleOption(game.optionRow, 1);
    else if (code === "Enter" || code === "Space" || code === "Escape") { game.screen = "title"; Sfx.menu(); }
  } else if (s === "worlds") {
    const cols = W >= 760 ? 4 : 2;
    if (code === "ArrowLeft" || code === "KeyA") moveMenu(-1, 4);
    else if (code === "ArrowRight" || code === "KeyD") moveMenu(1, 4);
    else if (code === "ArrowUp" || code === "KeyW") moveMenu(-cols, 4);
    else if (code === "ArrowDown" || code === "KeyS") moveMenu(cols, 4);
    else if (code === "Enter" || code === "Space") selectWorld(game.menuIndex);
    else if (code === "Escape") { game.screen = "title"; Sfx.menu(); }
  } else if (s === "tracks") {
    const cols = game.trackCols;
    if (code === "ArrowLeft" || code === "KeyA") moveMenu(-1, 10);
    else if (code === "ArrowRight" || code === "KeyD") moveMenu(1, 10);
    else if (code === "ArrowUp" || code === "KeyW") moveMenu(-cols, 10);
    else if (code === "ArrowDown" || code === "KeyS") moveMenu(cols, 10);
    else if (code === "Enter" || code === "Space") selectTrack(game.menuIndex);
    else if (code === "Escape") goToWorlds();
  } else if (s === "race" || s === "countdown") {
    if (code === "Space" || code === "ShiftLeft" || code === "ShiftRight" || code === "KeyN") activateTurbo();
    else if (code === "Escape" || code === "KeyP") pauseRace();
  } else if (s === "paused") {
    if (code === "Escape" || code === "KeyP" || code === "Enter") resumeRace();
    else if (code === "KeyM") goToTracks();
  } else if (s === "results") {
    if (code === "Enter" || code === "Space") resultPrimary();
    else if (code === "KeyR") startRace(game.world, game.track);
    else if (code === "Escape") goToTracks();
  }
}

function moveMenu(delta, count) {
  const next = game.menuIndex + delta;
  if (next < 0 || next >= count) return;
  game.menuIndex = next;
  Sfx.menu();
}

// Botones táctiles dibujados en el canvas (solo en pantallas táctiles)
function touchLayout() {
  const r = 38 * UI, m = 18 * UI, by = H - m - r;
  return {
    left: { x: m + r, y: by, r }, right: { x: m + r * 3.4, y: by, r },
    gas: { x: W - m - r * 1.2, y: by - r * 0.1, r: r * 1.2 }, brake: { x: W - m - r * 3.9, y: by + r * 0.1, r: r * 0.9 },
    nitro: { x: W - m - r * 1.2, y: by - r * 2.7, r: r * 0.85 }, pause: { x: W / 2, y: 12 * UI + 98 * UI, r: r * 0.55 },
  };
}
function touchButtonAt(x, y) {
  const L = touchLayout();
  for (const k of ["left", "right", "gas", "brake", "nitro", "pause"]) {
    const b = L[k];
    if (Math.hypot(x - b.x, y - b.y) <= b.r * 1.25) return k;
  }
  return null;
}
function applyTouch() {
  const active = new Set(touchPointers.values());
  keys.left = active.has("left");
  keys.right = active.has("right");
  keys.up = active.has("gas");
  keys.down = active.has("brake");
}

// ─────────────────────────────── 9. NAVEGACIÓN ENTRE PANTALLAS ───────────────
function goToWorlds() {
  game.screen = "worlds";
  game.menuIndex = game.world;
  Sfx.select();
}
function selectWorld(i) {
  if (!isWorldUnlocked(i)) { Sfx.deny(); return; }
  game.world = i;
  goToTracks(true);
}
function goToTracks(fromWorld) {
  Sfx.stopAll();
  game.screen = "tracks";
  game.menuIndex = fromWorld ? Math.max(0, Math.min(9, progress.unlocked - 1 - game.world * 10)) : game.track;
  Sfx.select();
}
function selectTrack(t) {
  if (!isTrackUnlocked(game.world, t)) { Sfx.deny(); return; }
  startRace(game.world, t);
}
function pauseRace() {
  if (game.screen !== "race" && game.screen !== "countdown") return;
  game.pausedFrom = game.screen;
  game.screen = "paused";
  Sfx.engineStop(); Sfx.ambientStop();
  for (const k in keys) keys[k] = false;
  touchPointers.clear();
}
function resumeRace() {
  if (game.screen !== "paused") return;
  game.screen = game.pausedFrom || "race";
  Sfx.engineStart(); Sfx.ambientStart(game.trk.plan.weather);
}

function startRace(w, t) {
  Sfx.stopAll();
  game.world = w; game.track = t;
  const trk = generateTrack(w, t);
  game.trk = trk;
  // Parrilla de 8 coches (4 filas de 2) detrás del pórtico; el jugador sale último.
  player.z = trk.startZ - 1400; player.x = 0.45; player.speed = 0; player.steer = 0;
  player.charges = TURBO_CHARGES; player.turboTime = 0;
  player.finished = false; player.finishTime = 0; player.offroad = false; player.crashCooldown = 0;
  const hard = progress.settings.difficulty === 1;
  const base = trk.plan.rivalBase * (hard ? 1.06 : 1);
  // velocidad objetivo escalonada: algunos rivales son más lentos que otros
  const grid = [
    ["red", -0.45, 0.08], ["blue", 0.45, 0.06], ["yellow", -0.45, 0.04], ["green", 0.45, 0.02],
    ["orange", -0.45, 0.0], ["purple", 0.45, -0.02], ["black", -0.45, -0.04],
  ];
  rivals = grid.map(([model, gx, bonus], i) => ({
    id: model, model, color: CAR_MODELS[model].dot,
    z: trk.startZ - 320 - Math.floor(i / 2) * 360, x: gx,
    lane: [-0.62, 0.3, -0.25, 0.62, 0, -0.5, 0.5][i],
    target: (base + bonus * (hard ? 1.15 : 1)) * MAX_SPEED, phase: i * 1.37,
  }));
  for (const r of rivals) { r.speed = 0; r.gridX = r.x; r.finished = false; r.finishTime = 0; }
  game.lap = 1; game.lapMsg = 0; game.padFlash = 0;
  game.time = 0; game.timeLeft = trk.plan.timeLimit * (hard ? 0.92 : 1); game.postFinish = 0;
  game.finishOrder = []; game.result = null; game.bgOffset = 0; game.shake = 0;
  game.countdownStep = 3; game.countdownTimer = 0; game.goTimer = 0;
  game.screen = "countdown";
  Weather.setKind(trk.plan.weather);
  Sfx.count(false);
  Sfx.ambientStart(trk.plan.weather);
}

function resultPrimary() {
  const r = game.result;
  if (!r) return;
  if (r.next) startRace(r.next[0], r.next[1]);
  else if (r.champion) { game.screen = "title"; }
  else startRace(game.world, game.track);
}

// ─────────────────────────────── 10. ACTUALIZACIÓN ───────────────────────────
function update(dt) {
  game.clock += dt;
  switch (game.screen) {
    case "countdown":
      updateCountdown(dt);
      Weather.update(dt, 0, 0);
      break;
    case "race":
      updateRace(dt);
      Weather.update(dt, player.speed / MAX_SPEED, player.steer);
      Sfx.ambientTick(dt);
      break;
    case "results":
      Confetti.update(dt);
      break;
  }
}

function updateCountdown(dt) {
  game.countdownTimer += dt;
  if (game.countdownTimer >= 0.85) {
    game.countdownTimer = 0;
    game.countdownStep--;
    if (game.countdownStep > 0) Sfx.count(false);
    else {
      Sfx.count(true);
      game.screen = "race";
      game.goTimer = 0.9;
      Sfx.engineStart();
    }
  }
}

// El circuito es cerrado: el índice de segmento se toma módulo la longitud de la vuelta.
function segIndexAt(trk, z) {
  const n = trk.segments.length;
  return ((Math.floor(z / SEGMENT_LENGTH) % n) + n) % n;
}
function findSegment(trk, z) {
  return trk.segments[segIndexAt(trk, z)];
}
function lapOf(trk, z) {
  return clamp(Math.floor((z - trk.startZ) / trk.lapLength) + 1, 1, LAPS);
}

function activateTurbo() {
  if (game.screen !== "race" || player.finished) return;
  if (player.turboTime > 0 || player.charges <= 0) return;
  player.charges--;
  player.turboTime = TURBO_TIME;
  Sfx.whoosh();
}

function updateRace(dt) {
  const trk = game.trk;
  if (game.autopilot) autopilotControl(trk);

  game.time += dt;
  if (!player.finished) game.timeLeft -= dt;
  game.goTimer = Math.max(0, game.goTimer - dt);
  game.offroadMsg = Math.max(0, game.offroadMsg - dt);
  player.crashCooldown = Math.max(0, player.crashCooldown - dt);

  const seg = findSegment(trk, player.z);
  const grip = WEATHER_GRIP[trk.plan.weather];
  const speedPercent = player.speed / MAX_SPEED;
  const turbo = player.turboTime > 0;
  if (turbo) player.turboTime = Math.max(0, player.turboTime - dt);

  // --- Dirección: a mayor velocidad, giro más brusco ---
  const steerAmount = dt * (STEER_MIN + STEER_GAIN * Math.min(1, speedPercent)) * grip;
  player.steer = keys.left ? -1 : keys.right ? 1 : 0;
  player.x += player.steer * steerAmount * (player.speed > 30 ? 1 : 0);

  // --- Fuerza centrífuga ∝ curve · v² ---
  player.x -= dt * 2 * speedPercent * speedPercent * seg.curve * CENTRIFUGAL;

  // --- Acelerador / freno. No se suma aceleración si ya se está en el tope. ---
  const cap = turbo ? TURBO_SPEED : MAX_SPEED;
  player.braking = keys.down;
  if (keys.down) {
    player.speed -= BRAKING * grip * dt;
  } else if (keys.up || turbo) {
    if (player.speed < cap) player.speed = Math.min(cap, player.speed + ACCEL * (turbo ? TURBO_ACCEL : 1) * grip * dt);
  } else {
    player.speed -= DECEL * dt;
  }
  // Si se superó el tope (p. ej. al terminar el turbo), baja suavemente.
  if (player.speed > cap) player.speed = Math.max(cap, player.speed - OVERSPEED_DECAY * dt);

  // --- Césped: la velocidad cae de golpe hasta 90 mph, sin detener el coche ---
  player.offroad = Math.abs(player.x) > 1;
  if (player.offroad) {
    if (player.speed > OFFROAD_SPEED) player.speed = Math.max(OFFROAD_SPEED, player.speed - OFFROAD_DECEL * dt);
    if (player.speed > 200) { Sfx.offroad(); game.offroadMsg = 0.5; }
  }
  player.speed = clamp(player.speed, 0, TURBO_SPEED);
  player.x = clamp(player.x, -2.6, 2.6);

  // --- Avance ---
  player.z += player.speed * dt;

  // --- Zonas de turbo: cruzar las flechas da un impulso sin gastar cargas ---
  game.padFlash = Math.max(0, game.padFlash - dt);
  const padSeg = findSegment(trk, player.z);
  if (padSeg.pad && Math.abs(player.x - padSeg.pad.c) <= padSeg.pad.hw + 0.06 && !player.finished) {
    if (player.turboTime < PAD_BOOST_TIME * 0.5) { Sfx.whoosh(); game.padFlash = 0.6; }
    player.turboTime = Math.max(player.turboTime, PAD_BOOST_TIME);
  }

  // --- Vueltas ---
  const lapNow = lapOf(trk, player.z);
  if (lapNow > game.lap && !player.finished) {
    game.lap = lapNow;
    game.lapMsg = 1.6;
    game.lapMsgText = lapNow === LAPS ? "¡ÚLTIMA VUELTA!" : `VUELTA ${lapNow}`;
    Sfx.select();
  }

  // --- Rivales: velocidad constante y zigzag suave dentro de su carril ---
  game.lapMsg = Math.max(0, game.lapMsg - dt);
  for (const r of rivals) {
    const accel = r.target / 2.2; // pequeña rampa de salida
    if (r.speed < r.target) r.speed = Math.min(r.target, r.speed + accel * dt);
    r.z += r.speed * dt;
    // salen desde su puesto de parrilla y se abren a su carril en los primeros metros
    const blend = clamp((r.z - (trk.startZ - 1500)) / 3000, 0, 1);
    r.x = lerp(r.gridX, r.lane + Math.sin(r.z * 0.00045 + r.phase) * 0.12, blend);
    if (!r.finished && r.z >= trk.finishZ) {
      r.finished = true; r.finishTime = game.time;
      game.finishOrder.push(r.id);
    }
  }

  // --- Choques con rivales: pérdida de velocidad y empujón lateral ---
  if (player.crashCooldown <= 0) {
    for (const r of rivals) {
      const dz = r.z - player.z;
      if (Math.abs(dz) < 260 && Math.abs(r.x - player.x) < 0.3) {
        if (dz > 0 && player.speed > r.speed) player.speed = r.speed * 0.8;
        else player.speed *= 0.7;
        player.x += (player.x >= r.x ? 1 : -1) * 0.22;
        player.crashCooldown = 0.5;
        game.shake = Math.max(game.shake, 7);
        Sfx.crash();
        break;
      }
    }
  }

  // --- Meta ---
  if (!player.finished && player.z >= trk.finishZ) {
    player.finished = true; player.finishTime = game.time;
    game.finishOrder.push("player");
    Sfx.fanfare(game.finishOrder.length <= 3);
  }
  if (player.finished) {
    game.postFinish += dt;
    if (game.postFinish > 1.8) endRace("finish");
  } else if (game.timeLeft <= 0) {
    game.timeLeft = 0;
    Sfx.fanfare(false);
    endRace("timeout");
  }

  // --- Fondo (paralaje con las curvas) y efectos ---
  game.bgOffset += seg.curve * speedPercent * dt * 60 * 1.6;
  game.shake = turbo ? Math.max(game.shake * 0.9, 3) : game.shake * Math.pow(0.02, dt);
  Sfx.engineUpdate(Math.min(1.4, speedPercent), turbo);
}

function currentRank() {
  let ahead = 0;
  for (const r of rivals) {
    if (player.finished) { if (r.finished && r.finishTime < player.finishTime) ahead++; }
    else if (r.finished || r.z > player.z) ahead++;
  }
  return ahead + 1;
}

function endRace(reason) {
  const w = game.world, t = game.track, idx = w * 10 + t;
  const rank = reason === "finish" ? game.finishOrder.indexOf("player") + 1 : currentRank();
  const podium = reason === "finish" && rank <= 3;
  let unlockMsg = "", next = null, champion = false;
  if (podium) {
    const prevBest = progress.best[idx];
    if (!prevBest || rank < prevBest) progress.best[idx] = rank;
    if (idx + 1 < 40) {
      const wasLocked = progress.unlocked <= idx + 1;
      progress.unlocked = Math.max(progress.unlocked, idx + 2);
      const nw = Math.floor((idx + 1) / 10), nt = (idx + 1) % 10;
      next = [nw, nt];
      if (wasLocked) unlockMsg = nt === 0 ? `¡Nuevo mundo desbloqueado: ${WORLDS[nw].name}!` : `¡Nueva pista desbloqueada: ${WORLDS[nw].tracks[nt]}!`;
    } else {
      champion = true;
      unlockMsg = "¡Has conquistado los 4 mundos!";
    }
    saveProgress();
  } else {
    unlockMsg = reason === "timeout" ? "Llega a la meta antes de que el reloj marque cero." : "Termina en el podio (1.º a 3.º) para avanzar.";
  }
  game.result = { reason, rank, time: player.finished ? player.finishTime : game.time, podium, unlockMsg, next, champion };
  game.screen = "results";
  Sfx.stopAll();
  if (podium) Confetti.start(champion ? 260 : rank === 1 ? 160 : 90);
}

// Piloto automático para pruebas: acelera, sigue el centro y esquiva rivales.
function autopilotControl(trk) {
  const seg = findSegment(trk, player.z);
  let target = 0;
  // busca la próxima zona de turbo cercana
  for (let i = 2; i < 40; i++) {
    const s2 = findSegment(trk, player.z + i * SEGMENT_LENGTH);
    if (s2.pad) { target = s2.pad.c; break; }
  }
  for (const r of rivals) {
    const dz = r.z - player.z;
    if (dz > -150 && dz < 2600 && Math.abs(r.x - target) < 0.45) {
      target = r.x >= 0 ? r.x - 0.62 : r.x + 0.62;
      break;
    }
  }
  target = clamp(target, -0.72, 0.72);
  // compensación anticipada de la fuerza centrífuga
  const push = 2 * Math.pow(player.speed / MAX_SPEED, 2) * seg.curve * CENTRIFUGAL;
  const err = target - player.x + push * 0.15;
  keys.left = err < -0.04;
  keys.right = err > 0.04;
  const outward = player.x * seg.curve < 0 && Math.abs(player.x) > 0.8;
  keys.up = !outward;
  keys.down = Math.abs(player.x) > 0.95 && outward;
  if (player.turboTime <= 0 && player.charges > 0 && !player.finished) {
    let straight = true;
    for (let i = 0; i < 90; i += 6) { if (Math.abs(findSegment(trk, player.z + i * SEGMENT_LENGTH).curve) > 0.6) { straight = false; break; } }
    if (straight && player.speed > MAX_SPEED * 0.8) activateTurbo();
  }
}

// ─────────────────────────────── 11. CLIMA (partículas en pantalla) ──────────
const Weather = {
  kind: "clear", drops: [], splashes: [],
  reset() { this.setKind(this.kind, true); },
  setKind(kind, force) {
    if (!force && kind === this.kind && this.drops.length) return;
    this.kind = kind; this.drops = []; this.splashes = [];
    const area = clamp((W * H) / (960 * 540), 0.5, 2);
    const n = kind === "rain" ? 260 : kind === "hail" ? 110 : kind === "snow" ? 190 : 0;
    for (let i = 0, c = Math.round(n * area); i < c; i++) this.drops.push(this.spawn(true));
  },
  spawn(anyY) {
    const d = {
      x: Math.random() * (W + 240) - 120, y: anyY ? Math.random() * H : -20 - Math.random() * 80,
      ground: H * (0.55 + Math.random() * 0.45), phase: Math.random() * 6.28, s: 0.6 + Math.random() * 0.8, bounces: 0,
    };
    if (this.kind === "rain") { d.vy = (950 + Math.random() * 450) * d.s; d.vx = -230 * d.s; }
    else if (this.kind === "hail") { d.vy = 520 + Math.random() * 300; d.vx = -50; }
    else { d.vy = 45 + Math.random() * 70; d.vx = 0; }
    return d;
  },
  update(dt, speedRatio, steer) {
    const k = this.kind;
    if (k === "clear" || k === "fog") return;
    for (let i = 0; i < this.drops.length; i++) {
      const d = this.drops[i];
      if (k === "rain") {
        d.x += (d.vx - steer * 220 * speedRatio) * dt;
        d.y += d.vy * (1 + speedRatio * 0.3) * dt;
        if (d.y > d.ground) {
          if (this.splashes.length < 90) this.splashes.push({ x: d.x, y: d.ground, life: 0.22, s: d.s });
          this.drops[i] = this.spawn(false);
        }
      } else if (k === "hail") {
        d.vy += 1500 * dt;
        d.x += (d.vx - steer * 160 * speedRatio) * dt;
        d.y += d.vy * dt;
        if (d.y > d.ground) {
          if (d.bounces < 2) { d.y = d.ground; d.vy = -Math.abs(d.vy) * 0.32; d.bounces++; }
          else this.drops[i] = this.spawn(false);
        }
      } else if (k === "snow") {
        d.x += (Math.sin(game.clock * 1.4 + d.phase) * 38 + (d.x - W / 2) * speedRatio * 0.55 - steer * 70 * speedRatio) * dt;
        d.y += (d.vy + speedRatio * 150 * d.s) * dt;
        if (d.y > H + 10 || d.x < -140 || d.x > W + 140) this.drops[i] = this.spawn(false);
      }
    }
    for (const s of this.splashes) s.life -= dt;
    this.splashes = this.splashes.filter((s) => s.life > 0);
  },
  draw() {
    const k = this.kind;
    if (k === "rain") {
      ctx.strokeStyle = "rgba(200,215,245,0.45)";
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (const d of this.drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.vx * 0.028, d.y - d.vy * 0.028); }
      ctx.stroke();
      ctx.strokeStyle = "rgba(215,228,255,0.55)";
      ctx.beginPath();
      for (const s of this.splashes) {
        const p = 1 - s.life / 0.22, rx = (2 + p * 9) * s.s * UI, ry = rx * 0.35;
        ctx.moveTo(s.x + rx, s.y); ctx.ellipse(s.x, s.y, rx, ry, 0, 0, Math.PI * 2);
      }
      ctx.stroke();
    } else if (k === "hail") {
      ctx.fillStyle = "rgba(235,244,255,0.95)";
      ctx.beginPath();
      for (const d of this.drops) { const r = 2.3 * d.s * UI; ctx.moveTo(d.x + r, d.y); ctx.arc(d.x, d.y, r, 0, Math.PI * 2); }
      ctx.fill();
    } else if (k === "snow") {
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.beginPath();
      for (const d of this.drops) { const r = (1.3 + d.s * 1.8) * UI; ctx.moveTo(d.x + r, d.y); ctx.arc(d.x, d.y, r, 0, Math.PI * 2); }
      ctx.fill();
    } else if (k === "fog") {
      const fc = game.trk ? game.trk.theme.fog : "#cdd2d8";
      const img = glowSprite(rgbOf(fc).join(","));
      ctx.globalAlpha = 0.3;
      ctx.imageSmoothingQuality = "low";
      for (let i = 0; i < 3; i++) {
        const y = H * (0.5 + i * 0.14), off = ((game.clock * (14 + i * 9) + game.bgOffset * 0.5 + i * 300) % (W + 600)) - 300;
        const r = W * 0.45;
        ctx.drawImage(img, off - r, y - r * 0.6, r * 2, r * 1.2);
      }
      ctx.globalAlpha = 1;
      ctx.imageSmoothingQuality = "high";
    }
  },
};

// Confeti para el podio y el campeonato
const Confetti = {
  parts: [],
  start(n) {
    this.parts = [];
    const cols = ["#ffd23a", "#ff4a3a", "#3f9bff", "#7cff6b", "#ff6ad5", "#ffffff"];
    for (let i = 0; i < n; i++) {
      this.parts.push({ x: Math.random() * W, y: -Math.random() * H * 0.8, vx: (Math.random() - 0.5) * 80, vy: 80 + Math.random() * 140, a: Math.random() * 6, va: (Math.random() - 0.5) * 8, c: cols[i % cols.length], s: 4 + Math.random() * 6 });
    }
  },
  update(dt) {
    for (const p of this.parts) {
      p.x += (p.vx + Math.sin(game.clock * 2 + p.a) * 30) * dt; p.y += p.vy * dt; p.a += p.va * dt;
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
    }
  },
  draw() {
    for (const p of this.parts) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
  },
};

// ─────────────────────────────── 12. RENDER PSEUDO-3D ────────────────────────
// Proyección clásica: scale = camDepth / z
//   x = W/2 + scale · (worldX − player.x · roadWidth) · W/2
//   y = H/2 + scale · camHeight · H/2        (horizonte en H/2)
//   ancho = scale · roadWidth · W/2
function project(p, cz, relX) {
  p.cz = cz;
  p.wx = relX;
  p.scale = CAM_DEPTH / cz;
  p.x = W / 2 + p.scale * relX * W / 2;
  p.y = H / 2 + p.scale * CAM_HEIGHT * H / 2;
  p.w = p.scale * ROAD_WIDTH * W / 2;
}

function fogAmount(trk, t) {
  if (trk.plan.weather === "fog") return clamp(1 - Math.exp(-t * 2.6), 0, 1);
  const k = trk.plan.hour === "night" ? 1 : 0.9;
  return clamp(Math.pow(t, 2.1) * k, 0, 1);
}

function quad(x1a, x1b, y1, x2a, x2b, y2, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1a, y1); ctx.lineTo(x1b, y1); ctx.lineTo(x2b, y2); ctx.lineTo(x2a, y2);
  ctx.closePath(); ctx.fill();
}
function strip(p1, p2, y1, y2, center, half, color) {
  quad(p1.x + p1.w * (center - half), p1.x + p1.w * (center + half), y1,
    p2.x + p2.w * (center - half), p2.x + p2.w * (center + half), y2, color);
}

function drawSegment(trk, seg) {
  const th = trk.theme, p1 = seg.p1, p2 = seg.p2, f = seg.fog, fc = th.fog;
  const y1 = p1.y + 1, y2 = p2.y; // solapa 1 px para evitar costuras
  const band = seg.band;
  const C = (c) => (f > 0.004 ? mix(c, fc, f) : c);
  // césped con franjas de corte
  ctx.fillStyle = C(th.grass[band]);
  ctx.fillRect(0, y2, W, y1 - y2);
  // arcén, pianos y asfalto (el arcén solo a los lados para no pintar dos veces)
  const shoulder = C(th.shoulder);
  strip(p1, p2, y1, y2, -1.1, 0.1, shoulder);
  strip(p1, p2, y1, y2, 1.1, 0.1, shoulder);
  strip(p1, p2, y1, y2, -1.07, 0.07, C(th.rumble[band]));
  strip(p1, p2, y1, y2, 1.07, 0.07, C(th.rumble[band]));
  strip(p1, p2, y1, y2, 0, 1, C(th.road[band]));
  // reflejo continuo del asfalto mojado
  if (th.sheen) strip(p1, p2, y1, y2, 0, 0.55, C(th.sheen));
  // marcas de desgaste de neumáticos en cada carril
  const wear = C(th.wear);
  for (const c of [-0.667, 0, 0.667]) { strip(p1, p2, y1, y2, c - 0.1, 0.045, wear); strip(p1, p2, y1, y2, c + 0.1, 0.045, wear); }
  // líneas de borde continuas
  const lane = C(th.lane);
  strip(p1, p2, y1, y2, -0.95, 0.018, lane);
  strip(p1, p2, y1, y2, 0.95, 0.018, lane);
  // 3 carriles: líneas discontinuas
  if (band === 0) { strip(p1, p2, y1, y2, -0.333, 0.014, lane); strip(p1, p2, y1, y2, 0.333, 0.014, lane); }
  // zona de turbo: franja naranja con flechas que laten
  if (seg.pad) drawBoostPad(seg, p1, p2, y1, y2, C);
  // línea a cuadros de salida / meta
  if (seg.index === trk.startIndex || seg.index === trk.startIndex + 1) {
    const cols = 14;
    for (let c = 0; c < cols; c++) {
      const color = (c + seg.index) % 2 ? C("#f4f4f4") : C("#151515");
      const a = -1 + (2 * c) / cols, b = -1 + (2 * (c + 1)) / cols;
      quad(p1.x + p1.w * a, p1.x + p1.w * b, y1, p2.x + p2.w * a, p2.x + p2.w * b, y2, color);
    }
  }
}

function drawBoostPad(seg, p1, p2, y1, y2, C) {
  const pad = seg.pad, c = pad.c, hw = pad.hw;
  const P = (t, off) => [lerp(p1.x, p2.x, t) + lerp(p1.w, p2.w, t) * off, lerp(y1, y2, t)];
  // base de la franja
  strip(p1, p2, y1, y2, c, hw, C("#5a1a06"));
  strip(p1, p2, y1, y2, c - hw + 0.02, 0.02, C("#ffd23a"));
  strip(p1, p2, y1, y2, c + hw - 0.02, 0.02, C("#ffd23a"));
  // flecha (chevron) apuntando hacia delante; el brillo recorre la franja
  const pulse = 0.5 + 0.5 * Math.sin(game.clock * 14 - seg.padStep * 1.3);
  ctx.fillStyle = C(mix("#ff6a00", "#fff27a", pulse));
  const a = P(0, c - hw * 0.8), b = P(0.62, c), d = P(0, c + hw * 0.8);
  const e = P(0.38, c + hw * 0.8), f = P(1, c), g = P(0.38, c - hw * 0.8);
  ctx.beginPath();
  ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(d[0], d[1]);
  ctx.lineTo(e[0], e[1]); ctx.lineTo(f[0], f[1]); ctx.lineTo(g[0], g[1]);
  ctx.closePath(); ctx.fill();
}

function drawSprite(img, worldW, sx, sy, scale, flip, alpha) {
  const destW = worldW * scale * W / 2;
  if (destW < 1.2) return null;
  const destH = destW * img.height / img.width;
  if (sx + destW / 2 < 0 || sx - destW / 2 > W || sy - destH > H || destH > H * 5) return null;
  if (alpha < 0.02) return null;
  ctx.globalAlpha = alpha;
  if (flip) {
    ctx.save(); ctx.translate(sx, sy); ctx.scale(-1, 1);
    ctx.drawImage(img, -destW / 2, -destH, destW, destH);
    ctx.restore();
  } else {
    ctx.drawImage(img, sx - destW / 2, sy - destH, destW, destH);
  }
  ctx.globalAlpha = 1;
  return { destW, destH };
}

function drawGate(trk, seg, kind) {
  const p = seg.p1, k = p.scale * W / 2;
  if (k * 4000 < 6) return;
  const alpha = 1 - seg.fog * 0.95;
  ctx.globalAlpha = alpha;
  const lx = p.x - p.w * 1.24, rx = p.x + p.w * 1.24, gy = p.y;
  const postW = 150 * k, postH = 1800 * k, bannerH = 380 * k, top = gy - postH;
  for (const x of [lx, rx]) {
    const pg = ctx.createLinearGradient(x - postW / 2, 0, x + postW / 2, 0);
    pg.addColorStop(0, "#3a3f45"); pg.addColorStop(0.5, "#c3cad1"); pg.addColorStop(1, "#30353b");
    ctx.fillStyle = pg; ctx.fillRect(x - postW / 2, top, postW, postH);
  }
  // pancarta a cuadros (salida y meta en el mismo pórtico)
  const cols = 24, rows = 3, cw = (rx - lx) / cols, ch = bannerH / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = (r + c) % 2 ? "#f4f4f4" : "#161616";
      ctx.fillRect(lx + c * cw, top + r * ch, cw + 0.5, ch + 0.5);
    }
  }
  // semáforo: se enciende en rojo durante la cuenta atrás y pasa a verde
  const lights = 5, step = game.screen === "countdown" ? 3 - game.countdownStep : 5;
  for (let i = 0; i < lights; i++) {
    const lxI = lerp(lx, rx, 0.3 + (i * 0.4) / (lights - 1)), ly = top + bannerH + 120 * k, lr = 55 * k;
    ctx.fillStyle = "#111"; ctx.fillRect(lxI - lr * 1.3, ly - lr * 1.3, lr * 2.6, lr * 2.6);
    const on = game.screen === "countdown" ? i < step * 2 : true;
    ctx.fillStyle = game.screen === "countdown" ? (on ? "#ff2a1a" : "#3a0a0a") : "#2aff5a";
    ctx.beginPath(); ctx.arc(lxI, ly, lr, 0, Math.PI * 2); ctx.fill();
  }
  // rótulo según la vuelta que empieza al cruzar este pórtico
  const rawLap = Math.floor((player.z - trk.startZ) / trk.lapLength) + 1;
  const nextLap = player.z < seg.absIndex * SEGMENT_LENGTH ? rawLap + 1 : rawLap;
  const text = game.screen === "countdown" ? "SALIDA" : (nextLap > LAPS || player.finished) ? "META" : `VUELTA ${Math.max(1, nextLap)}/${LAPS}`;
  const fs = Math.max(6, bannerH * 0.56);
  ctx.font = `italic 900 ${fs}px ${FONT_TITLE}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = "#f4f4f4";
  ctx.fillRect(p.x - tw * 0.6, top + bannerH * 0.12, tw * 1.2, bannerH * 0.76);
  ctx.fillStyle = "#c8141a";
  ctx.fillText(text, p.x, top + bannerH * 0.52);
  ctx.globalAlpha = 1;
}

function drawCarInWorld(trk, seg, car, camZ) {
  const cz = car.z - camZ;
  if (cz < 40) return;
  const scale = CAM_DEPTH / cz;
  const pct = clamp((car.z - seg.absIndex * SEGMENT_LENGTH) / SEGMENT_LENGTH, 0, 1);
  const wx = lerp(seg.p1.wx, seg.p2.wx, pct) + car.x * ROAD_WIDTH;
  const sx = W / 2 + scale * wx * W / 2, sy = H / 2 + scale * CAM_HEIGHT * H / 2;
  const img = tintedSprite("car-" + car.model, carSprite(car.model), trk.theme.spriteTint);
  const r = drawSprite(img, CAR_WORLD_W, sx, sy, scale, false, 1 - seg.fog * 0.95);
  if (!r) return;
  // pilotos encendidos de noche / con mal tiempo
  if (trk.plan.hour === "night" || trk.plan.weather !== "clear") {
    for (const [fx, fy] of TAIL_POS[CAR_MODELS[car.model].lights]) {
      game.glows.push({ x: sx + fx * r.destW, y: sy - (CAR_GROUND + fy) * r.destH, r: r.destW * 0.22, c: "255,40,25", a: 0.75 * (1 - seg.fog) });
    }
  }
}

function renderWorld(trk) {
  const segs = trk.segments, n = segs.length;
  const camZ = player.z - currentCamDist();
  const baseIndex = Math.floor(camZ / SEGMENT_LENGTH); // índice absoluto (crece vuelta a vuelta)
  const baseSeg = segs[((baseIndex % n) + n) % n];
  const basePercent = (camZ - baseIndex * SEGMENT_LENGTH) / SEGMENT_LENGTH;
  const camX = player.x * ROAD_WIDTH;
  const drawDistance = Math.round(trk.drawDistance * QUALITY_DISTANCE[qualityLevel]);
  // en equipos lentos, filtrado 'medium' (mipmaps + bilineal) para los sprites lejanos
  ctx.imageSmoothingQuality = qualityLevel >= 2 ? "medium" : "high";

  // Proyecta los límites de cada segmento acumulando la curvatura (x += dx; dx += curve)
  let x = 0, dx = -(baseSeg.curve * basePercent);
  const visible = [];
  for (let i = 0; i < drawDistance; i++) {
    const idx = baseIndex + i;
    const seg = segs[((idx % n) + n) % n];
    seg.absIndex = idx;
    seg.fog = fogAmount(trk, i / drawDistance);
    project(seg.p1, idx * SEGMENT_LENGTH - camZ, x - camX);
    project(seg.p2, (idx + 1) * SEGMENT_LENGTH - camZ, x + dx - camX);
    x += dx; dx += seg.curve;
    visible.push(seg);
  }

  // Suelo de fondo (bruma) por si queda hueco hasta el horizonte
  ctx.fillStyle = trk.theme.fog;
  ctx.fillRect(0, H / 2 - 1, W, H / 2 + 1);

  // Carretera: de lejos a cerca (algoritmo del pintor)
  for (let k = visible.length - 1; k >= 0; k--) {
    const seg = visible[k];
    if (seg.p1.cz <= CAM_DEPTH || seg.p2.y >= seg.p1.y) continue;
    drawSegment(trk, seg);
  }

  // Sprites: decoración, pórticos y rivales, también de lejos a cerca
  const bySeg = new Map();
  for (const r of rivals) {
    const idx = Math.floor(r.z / SEGMENT_LENGTH);
    if (!bySeg.has(idx)) bySeg.set(idx, []);
    bySeg.get(idx).push(r);
  }
  const season = trk.theme.season;
  const night = trk.plan.hour === "night";
  const behindPlayer = [];
  for (let k = visible.length - 1; k >= 0; k--) {
    const seg = visible[k];
    if (seg.p1.cz <= 60) continue;
    const alpha = 1 - seg.fog * 0.95;
    for (const sp of seg.sprites) {
      const def = DECOR[sp.kind];
      const img = tintedSprite(`decor-${sp.kind}-${season}-${sp.variant}`, decorSprite(sp.kind, season, sp.variant), trk.theme.spriteTint);
      const sx = seg.p1.x + seg.p1.scale * sp.offset * ROAD_WIDTH * W / 2;
      const r = drawSprite(img, def.w, sx, seg.p1.y, seg.p1.scale, sp.flip, alpha);
      if (r && night) {
        if (sp.kind === "lamp") {
          const hx = sp.flip ? sx + (0.5 - LAMP_HEAD[0]) * r.destW : sx - (0.5 - LAMP_HEAD[0]) * r.destW;
          game.glows.push({ x: hx, y: seg.p1.y - r.destH * (1 - LAMP_HEAD[1]), r: r.destW * 1.1, c: "255,214,140", a: 0.85 * alpha, pool: true, py: seg.p1.y, pw: r.destW });
        } else if (sp.kind === "tower") {
          game.glows.push({ x: sx, y: seg.p1.y - r.destH * 0.9, r: r.destW * 1.2, c: "255,240,200", a: 0.7 * alpha });
        } else if (sp.kind === "billboard") {
          game.glows.push({ x: sx, y: seg.p1.y - r.destH * 0.95, r: r.destW * 0.5, c: "255,240,200", a: 0.45 * alpha });
        }
      }
    }
    if (seg.gate) drawGate(trk, seg, seg.gate);
    const cars = bySeg.get(seg.absIndex);
    if (cars) {
      cars.sort((a, b) => b.z - a.z);
      for (const car of cars) {
        if (car.z < player.z) behindPlayer.push([seg, car]);
        else drawCarInWorld(trk, seg, car, camZ);
      }
    }
  }
  drawPlayerCar(trk);
  // rivales entre la cámara y el jugador (más cerca que él)
  behindPlayer.sort((a, b) => b[1].z - a[1].z);
  for (const [seg, car] of behindPlayer) drawCarInWorld(trk, seg, car, camZ);
}

function drawPlayerCar(trk) {
  const scale = CAM_DEPTH / currentCamDist();
  // el coche del jugador va algo más iluminado que el entorno (faros de los rivales, farolas)
  const img = tintedSprite("car-player", carSprite("player"), trk.theme.spriteTint, 0.7);
  const destW = CAR_WORLD_W * scale * W / 2, destH = destW * img.height / img.width;
  const sp = player.speed / MAX_SPEED;
  const bounce = Math.sin(game.clock * 40) * 1.1 * Math.min(1, sp) + (player.offroad && player.speed > 200 ? (Math.random() - 0.5) * 5 : 0);
  const lean = player.steer * Math.min(1, sp * 3) * 0.045;
  const x = W / 2 + player.steer * Math.min(1, sp * 3) * 6, y = H - 2 + bounce;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lean);
  ctx.drawImage(img, -destW / 2, -destH, destW, destH);
  ctx.restore();
  const lights = TAIL_POS[CAR_MODELS.player.lights];
  const brake = player.braking && player.speed > 50;
  if (brake || trk.plan.hour === "night" || trk.plan.weather !== "clear") {
    for (const [fx, fy] of lights) {
      game.glows.push({ x: x + fx * destW, y: y - (CAR_GROUND + fy) * destH, r: destW * (brake ? 0.32 : 0.18), c: "255,40,25", a: brake ? 0.95 : 0.55 });
    }
  }
  if (player.turboTime > 0) {
    for (const [fx, fy] of EXHAUST_POS) {
      const ex = x + fx * destW, ey = y - (CAR_GROUND + fy) * destH;
      const len = destH * (0.35 + Math.random() * 0.25);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const fl = ctx.createRadialGradient(ex, ey + len * 0.2, 1, ex, ey + len * 0.2, len);
      fl.addColorStop(0, "rgba(255,255,220,0.95)"); fl.addColorStop(0.3, "rgba(255,180,60,0.8)");
      fl.addColorStop(0.7, "rgba(255,70,20,0.35)"); fl.addColorStop(1, "rgba(255,40,0,0)");
      ctx.fillStyle = fl;
      ctx.beginPath(); ctx.ellipse(ex, ey + len * 0.35, destW * 0.07, len * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

// Perfil de montaña periódico (suma de senos) para que el paralaje sea infinito.
function ridge(x, seed, detail) {
  const t = (x / 1600) * Math.PI * 2;
  return 0.55 + 0.25 * Math.sin(t * 2 + seed) + 0.14 * Math.sin(t * 5 + seed * 1.7) + detail * 0.06 * Math.sin(t * 13 + seed * 2.3);
}

// ---- Capas prerenderizadas (se regeneran al cambiar de pista o de tamaño) ----
const layerCache = new Map();
function cachedLayer(key, w, h, draw) {
  let c = layerCache.get(key);
  if (c) return c;
  if (layerCache.size > 60) layerCache.clear();
  c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = "high";
  draw(g, c.width, c.height);
  layerCache.set(key, c);
  return c;
}
// Degradado vertical en una tira de 2 px de ancho (se estira a pantalla completa: muy barato)
function vGradient(key, stops) {
  return cachedLayer("vg|" + key, 2, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    for (const [o, c] of stops) gr.addColorStop(o, c);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
}
// Halo radial blanco (se tiñe con el color pedido)
function glowSprite(rgb) {
  return cachedLayer("glow|" + rgb, 128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(0.35, `rgba(${rgb},0.45)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
}
function cloudSprite(rgb, alpha, variant) {
  return cachedLayer(`cloud|${rgb}|${alpha}|${variant}`, 512, 220, (g, w, h) => {
    const rng = mulberry32(31 + variant * 17);
    for (let p = 0; p < 6; p++) {
      // cada bocanada queda dentro del lienzo para que no se vean bordes rectos
      const pr = h * (0.26 + rng() * 0.12);
      const px = w * (0.2 + p * 0.12), py = h * (0.58 + (rng() - 0.5) * 0.1);
      const cg = g.createRadialGradient(px, py, pr * 0.1, px, py, pr);
      cg.addColorStop(0, `rgba(${rgb},${alpha})`); cg.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = cg; g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2); g.fill();
    }
  });
}
const MOUNTAIN_LAYERS = [
  { amp: 0.2, speed: 0.18, seed: 1.3, detail: 1 },
  { amp: 0.13, speed: 0.4, seed: 3.1, detail: 0.8 },
  { amp: 0.07, speed: 0.75, seed: 5.7, detail: 0.5 },
];
// Cada cordillera es una tira periódica de 1600 px que se repite horizontalmente.
function mountainStrip(trk, li) {
  const th = trk.theme, L = MOUNTAIN_LAYERS[li], amp = H * L.amp;
  const s = Math.min(DPR, 1.5);
  const key = `mtn|${trk.plan.key}|${li}|${Math.round(H)}|${s}`;
  return cachedLayer(key, 1600 * s, (amp * 1.05 + 2) * s, (g, w, h) => {
    g.scale(s, s);
    const hh = h / s;
    g.beginPath();
    g.moveTo(0, hh);
    for (let px = 0; px <= 1600; px += 4) g.lineTo(px, hh - amp * ridge(px, L.seed, L.detail));
    g.lineTo(1600, hh);
    g.closePath();
    const mg = g.createLinearGradient(0, hh - amp, 0, hh);
    mg.addColorStop(0, th.mountains[li]); mg.addColorStop(1, mix(th.mountains[li], th.fog, 0.45));
    g.fillStyle = mg;
    g.fill();
    if (th.snowCaps[li]) {
      g.save();
      g.clip();
      const snowLine = hh - amp * (li === 2 ? 0.55 : 0.68);
      const sgc = g.createLinearGradient(0, hh - amp, 0, snowLine);
      sgc.addColorStop(0, rgba(th.snowColor, 0.95)); sgc.addColorStop(1, rgba(th.snowColor, 0.25));
      g.fillStyle = sgc;
      g.fillRect(0, 0, 1600, snowLine);
      g.restore();
    }
  });
}

function drawSky(trk) {
  const th = trk.theme, hz = H / 2, hour = trk.plan.hour, weather = trk.plan.weather;
  ctx.imageSmoothingQuality = "low"; // capas suaves: bilineal basta y es mucho más barato
  const clear = weather === "clear";
  ctx.drawImage(vGradient(`sky|${th.sky[0]}|${th.sky[1]}`, [[0, th.sky[0]], [1, th.sky[1]]]), 0, 0, W, hz + 1);

  if (hour === "night") {
    if (weather !== "fog") {
      const rng = mulberry32(12345);
      for (let i = 0; i < 140; i++) {
        const sx = rng() * W, sy = rng() * hz * 0.9, sp = 1 + rng() * 3, big = rng() < 0.1;
        const tw = i % 5 === 0 ? 0.5 + 0.5 * Math.sin(game.clock * sp + i) : 0.6;
        ctx.fillStyle = `rgba(255,255,255,${(clear ? 0.35 : 0.12) + tw * (clear ? 0.5 : 0.15)})`;
        ctx.fillRect(sx, sy, big ? 2 : 1.3, big ? 2 : 1.3);
      }
    }
    const mx = W * 0.78, my = hz * 0.32, mr = Math.max(14, 26 * UI);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.35;
    ctx.drawImage(glowSprite("200,215,255"), mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
    ctx.restore();
    const mg = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, 1, mx, my, mr);
    mg.addColorStop(0, "#ffffff"); mg.addColorStop(1, "#c9d0e6");
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(150,160,190,0.35)";
    ctx.beginPath(); ctx.arc(mx - mr * 0.3, my + mr * 0.1, mr * 0.2, 0, Math.PI * 2); ctx.arc(mx + mr * 0.25, my - mr * 0.3, mr * 0.13, 0, Math.PI * 2); ctx.fill();
  } else if (clear || (weather === "fog" && hour === "sunset")) {
    const sunset = hour === "sunset";
    const sy = sunset ? hz - Math.max(30, 60 * UI) * 0.55 : hz * 0.3;
    const sr = sunset ? Math.max(34, 68 * UI) : Math.max(16, 30 * UI);
    const span = W + 200;
    const sunX = (((W * 0.72 - game.bgOffset * 0.05) % span) + span) % span - 100;
    const hr = sr * (sunset ? 6 : 5);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = sunset ? 0.6 : 0.5;
    ctx.drawImage(glowSprite(sunset ? "255,170,90" : "255,250,210"), sunX - hr, sy - hr, hr * 2, hr * 2);
    ctx.restore();
    const sgd = ctx.createRadialGradient(sunX, sy, 1, sunX, sy, sr);
    sgd.addColorStop(0, sunset ? "#fff2c0" : "#ffffff");
    sgd.addColorStop(1, sunset ? "#ff8a3a" : "#fff1b0");
    ctx.fillStyle = sgd; ctx.beginPath(); ctx.arc(sunX, sy, sr, 0, Math.PI * 2); ctx.fill();
  }

  // Nubes suaves con paralaje (sprites prerenderizados)
  const cloudCount = clear ? 6 : 11;
  const cloudCol = hour === "night" ? "70,80,110" : hour === "sunset" ? "255,200,170" : clear ? "255,255,255" : "200,205,212";
  const cloudAlpha = hour === "night" ? 0.25 : clear ? 0.75 : 0.6;
  const rng = mulberry32(777);
  for (let i = 0; i < cloudCount; i++) {
    const baseX = rng() * (W + 400), cy = hz * (0.12 + rng() * (clear ? 0.45 : 0.7)), size = (60 + rng() * 90) * UI, drift = 4 + rng() * 6;
    const cx = ((baseX - game.bgOffset * 0.25 - game.clock * drift) % (W + 400) + W + 400) % (W + 400) - 200;
    const cw = size * 2.9, ch = cw * 220 / 512;
    ctx.drawImage(cloudSprite(cloudCol, cloudAlpha, i % 3), cx - cw / 2, cy - ch * 0.55, cw, ch);
  }

  // Tres capas de cordillera con perspectiva atmosférica y cumbres nevadas
  for (let li = 0; li < 3; li++) {
    const L = MOUNTAIN_LAYERS[li], amp = H * L.amp;
    const strip = mountainStrip(trk, li);
    const stripH = amp * 1.05 + 2;
    const off = ((game.bgOffset * L.speed * 6) % 1600 + 1600) % 1600;
    for (let x = -off; x < W; x += 1600) ctx.drawImage(strip, x, hz + 2 - stripH, 1600 + 0.5, stripH);
  }
  // Línea de bosque en el horizonte
  ctx.fillStyle = th.treeline;
  ctx.beginPath();
  ctx.moveTo(0, hz + 1);
  const toff = game.bgOffset * 9;
  for (let px = 0; px <= W + 4; px += 4) {
    const v = Math.abs(Math.sin((px + toff) * 0.09)) * 0.6 + Math.abs(Math.sin((px + toff) * 0.031)) * 0.4;
    ctx.lineTo(px, hz - (3 + v * 8) * UI);
  }
  ctx.lineTo(W, hz + 1);
  ctx.closePath();
  ctx.fill();
  // Bruma en el horizonte para ocultar el corte de la distancia de dibujo
  ctx.drawImage(vGradient(`haze|${th.fog}`, [[0, rgba(th.fog, 0)], [0.7, rgba(th.fog, 0.55)], [1, rgba(th.fog, 0.9)]]), 0, hz - H * 0.08, W, H * 0.11);
  ctx.imageSmoothingQuality = "high";
}

// Capa de ambiente a baja resolución: oscuridad nocturna, tinte de atardecer,
// niebla densa y viñeta. Se escala a pantalla completa (degradados suaves).
function ambientOverlay(trk) {
  const hour = trk.plan.hour, weather = trk.plan.weather, fog = trk.theme.fog;
  const ow = 320, oh = Math.max(90, Math.round(320 * H / W));
  return cachedLayer(`amb|${hour}|${weather}|${fog}|${Math.round(W)}x${Math.round(H)}`, ow, oh, (g, w, h) => {
    g.scale(w / W, h / H);
    if (hour === "night") {
      const dg = g.createRadialGradient(W / 2, H * 0.86, H * 0.12, W / 2, H * 0.72, Math.max(W, H) * 0.85);
      dg.addColorStop(0, "rgba(0,0,12,0)"); dg.addColorStop(0.5, "rgba(0,0,14,0.35)"); dg.addColorStop(1, "rgba(0,0,16,0.78)");
      g.fillStyle = dg; g.fillRect(0, 0, W, H);
    }
    if (hour === "sunset") { g.fillStyle = "rgba(255,120,50,0.07)"; g.fillRect(0, 0, W, H); }
    if (weather === "fog") {
      const fg = g.createLinearGradient(0, H * 0.2, 0, H * 0.95);
      fg.addColorStop(0, rgba(fog, 0)); fg.addColorStop(0.42, rgba(fog, 0.36)); fg.addColorStop(1, rgba(fog, 0));
      g.fillStyle = fg; g.fillRect(0, H * 0.2, W, H * 0.75);
    }
    const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.hypot(W, H) * 0.6);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.38)");
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
  });
}

function drawLightingAndEffects(trk) {
  const night = trk.plan.hour === "night";
  ctx.imageSmoothingQuality = "low";
  ctx.drawImage(ambientOverlay(trk), 0, 0, W, H);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  if (night) {
    // haz de los faros
    const sx = W / 2 + player.steer * 20;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(sx - W * 0.1, H * 0.86); ctx.lineTo(sx + W * 0.1, H * 0.86);
    ctx.lineTo(sx + W * 0.34 + player.steer * 60, H * 0.53); ctx.lineTo(sx - W * 0.34 + player.steer * 60, H * 0.53);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(vGradient("beam", [[0, "rgba(255,240,200,0)"], [1, "rgba(255,240,200,0.24)"]]), 0, H * 0.52, W, H * 0.48);
    ctx.restore();
  }
  // halos: farolas, torres y pilotos (sprite de halo tintado, modo "lighter")
  for (const gl of game.glows) {
    if (gl.r < 1) continue;
    ctx.globalAlpha = clamp(gl.a, 0, 1);
    const img = glowSprite(gl.c);
    ctx.drawImage(img, gl.x - gl.r, gl.y - gl.r, gl.r * 2, gl.r * 2);
    if (gl.pool) {
      // charco de luz de la farola sobre el asfalto
      const pr = gl.pw * 1.6;
      ctx.globalAlpha = clamp(0.35 * gl.a, 0, 1);
      ctx.drawImage(img, gl.x - pr, gl.py - pr * 0.28, pr * 2, pr * 0.56);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.imageSmoothingQuality = "high";
}

function drawSpeedLines() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = "rgba(255,255,255,0.28)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  const cx = W / 2, cy = H * 0.5, R = Math.hypot(W, H) / 2;
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2;
    const r0 = R * (0.45 + Math.random() * 0.35), len = R * (0.08 + Math.random() * 0.18);
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.75);
    ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len) * 0.75);
  }
  ctx.stroke();
  ctx.restore();
}

function drawRaceScene() {
  const trk = game.trk;
  game.glows.length = 0;
  ctx.save();
  if (game.shake > 0.3 && game.screen === "race") ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  drawSky(trk);
  renderWorld(trk);
  Weather.draw();
  drawLightingAndEffects(trk);
  ctx.restore();
  if (player.turboTime > 0 && game.screen === "race") drawSpeedLines();
}

// ─────────────────────────────── 13. HUD ─────────────────────────────────────
function panel(x, y, w, h, r) {
  roundRect(ctx, x, y, w, h, r == null ? 10 * UI : r);
  ctx.fillStyle = "rgba(6,10,24,0.62)";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.18)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}
function fitFont(text, maxW, px, weight, family) {
  ctx.font = `${weight} ${px}px ${family}`;
  while (px > 7 && ctx.measureText(text).width > maxW) { px -= 1; ctx.font = `${weight} ${px}px ${family}`; }
  return px;
}

function drawHUD() {
  const trk = game.trk, u = UI, pad = 12 * u;
  // En pantallas táctiles la parte baja queda libre para los botones:
  // el NITRO pasa bajo el temporizador y el minimapa bajo el velocímetro.
  const touch = game.touchMode;
  ctx.textBaseline = "alphabetic";

  // Arriba a la izquierda: temporizador, mundo, pista y condición
  const lw = Math.min(270 * u, W * 0.36);
  panel(pad, pad, lw, 80 * u);
  const low = game.timeLeft < 10 && !player.finished;
  const blink = Math.floor(game.clock * 4) % 2 === 0;
  ctx.textAlign = "left";
  ctx.font = `bold ${10 * u}px ${FONT_UI}`;
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("TIEMPO", pad + 10 * u, pad + 16 * u);
  ctx.font = `bold ${26 * u}px ${FONT_MONO}`;
  ctx.fillStyle = low ? (blink ? "#ff3030" : "#7a1010") : "#7fe3ff";
  ctx.fillText(fmtTime(game.timeLeft), pad + 10 * u, pad + 42 * u);
  fitFont(`${trk.world.name} · ${game.track + 1}/10 ${trk.plan.name}`, lw - 20 * u, 12 * u, "bold", FONT_UI);
  ctx.fillStyle = "#e9edf2";
  ctx.fillText(`${trk.world.name} · ${game.track + 1}/10 ${trk.plan.name}`, pad + 10 * u, pad + 59 * u);
  ctx.font = `${11 * u}px ${FONT_UI}`;
  ctx.fillStyle = "#ffd23a";
  ctx.fillText(`${HOUR_LABEL[trk.plan.hour]} · ${WEATHER_LABEL[trk.plan.weather]}`, pad + 10 * u, pad + 73 * u);

  // Arriba al centro: posición y barra de progreso
  const rank = currentRank();
  ctx.textAlign = "center";
  const numPx = 40 * u;
  ctx.font = `italic 900 ${numPx}px ${FONT_TITLE}`;
  const numW = ctx.measureText(String(rank)).width;
  ctx.font = `italic 900 ${numPx * 0.5}px ${FONT_TITLE}`;
  const sufW = ctx.measureText(ordinal(rank).slice(-2)).width;
  const startX = W / 2 - (numW + sufW) / 2;
  ctx.textAlign = "left";
  ctx.lineWidth = 5 * u; ctx.strokeStyle = "rgba(0,0,0,0.65)";
  ctx.font = `italic 900 ${numPx}px ${FONT_TITLE}`;
  ctx.strokeText(String(rank), startX, pad + 38 * u);
  ctx.fillStyle = rank === 1 ? "#ffd23a" : rank <= 3 ? "#e6ecf2" : "#ff8a6a";
  ctx.fillText(String(rank), startX, pad + 38 * u);
  ctx.font = `italic 900 ${numPx * 0.5}px ${FONT_TITLE}`;
  ctx.strokeText(ordinal(rank).slice(-2), startX + numW + 2, pad + 20 * u);
  ctx.fillText(ordinal(rank).slice(-2), startX + numW + 2, pad + 20 * u);
  const bw = Math.min(300 * u, W * 0.34), bx = W / 2 - bw / 2, by = pad + 50 * u;
  roundRect(ctx, bx - 6 * u, by - 8 * u, bw + 12 * u, 22 * u, 8 * u);
  ctx.fillStyle = "rgba(6,10,24,0.55)"; ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(bx, by + 2 * u, bw, 2 * u);
  ctx.fillStyle = "#3ddc5a"; ctx.fillRect(bx - 1, by - 3 * u, 3 * u, 12 * u);
  for (let i = 0; i < 4; i++) { ctx.fillStyle = i % 2 ? "#111" : "#f4f4f4"; ctx.fillRect(bx + bw - 2 * u, by - 3 * u + i * 3 * u, 4 * u, 3 * u); }
  // marcas de cada vuelta en la barra
  ctx.fillStyle = "rgba(255,210,58,0.9)";
  for (let l = 1; l < LAPS; l++) ctx.fillRect(bx + (bw * l) / LAPS - 1, by - 2 * u, 2 * u, 10 * u);
  const prog = (z) => bx + clamp((z - trk.startZ) / (trk.finishZ - trk.startZ), 0, 1) * bw;
  for (const r of rivals) {
    ctx.fillStyle = r.color;
    ctx.beginPath(); ctx.arc(prog(r.z), by + 3 * u, 4 * u, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(prog(player.z), by + 3 * u, 5.5 * u, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // vuelta actual
  ctx.textAlign = "center";
  ctx.font = `italic 900 ${15 * u}px ${FONT_TITLE}`;
  ctx.lineWidth = 4 * u; ctx.strokeStyle = "rgba(0,0,0,0.7)";
  const lapLabel = `VUELTA ${Math.min(game.lap, LAPS)}/${LAPS}`;
  ctx.strokeText(lapLabel, W / 2, by + 30 * u);
  ctx.fillStyle = game.lap === LAPS ? "#ffd23a" : "#ffffff";
  ctx.fillText(lapLabel, W / 2, by + 30 * u);
  ctx.textAlign = "left";

  // Arriba a la derecha: velocímetro digital
  const mph = Math.round(player.speed / SPEED_SCALE);
  const turbo = player.turboTime > 0;
  const sw = 176 * u, sx = W - pad - sw;
  panel(sx, pad, sw, 80 * u);
  ctx.textAlign = "right";
  ctx.font = `bold ${48 * u}px ${FONT_MONO}`;
  ctx.fillStyle = turbo ? "rgba(255,150,30,0.1)" : "rgba(255,40,40,0.1)";
  ctx.fillText("888", sx + sw - 52 * u, pad + 50 * u);
  // brillo del display LED (trazo ancho translúcido, más barato que shadowBlur)
  const digits = String(mph).padStart(3, " ");
  ctx.lineJoin = "round";
  ctx.lineWidth = 7 * u;
  ctx.strokeStyle = turbo ? "rgba(255,150,30,0.22)" : "rgba(255,30,30,0.22)";
  ctx.strokeText(digits, sx + sw - 52 * u, pad + 50 * u);
  ctx.fillStyle = turbo ? "#ffa530" : "#ff2a2a";
  ctx.fillText(digits, sx + sw - 52 * u, pad + 50 * u);
  ctx.font = `bold ${15 * u}px ${FONT_UI}`;
  ctx.fillText("mph", sx + sw - 12 * u, pad + 50 * u);
  const segs = 18, fill = Math.round(clamp(player.speed / TURBO_SPEED, 0, 1) * segs), segW = (sw - 24 * u) / segs;
  for (let i = 0; i < segs; i++) {
    const t = i / segs;
    ctx.fillStyle = i < fill ? (t < 0.55 ? "#3ddc5a" : t < 0.75 ? "#ffd23a" : "#ff3a2a") : "rgba(255,255,255,0.12)";
    ctx.fillRect(sx + 12 * u + i * segW, pad + 62 * u, segW - 2 * u, 8 * u);
  }

  // Abajo a la izquierda: NITRO
  const nw = 200 * u, nh = 64 * u, ny = touch ? pad + 88 * u : H - pad - nh;
  panel(pad, ny, nw, nh);
  ctx.textAlign = "left";
  ctx.font = `italic 900 ${16 * u}px ${FONT_TITLE}`;
  ctx.fillStyle = turbo && blink ? "#ffffff" : "#ffa530";
  ctx.fillText(turbo ? "¡TURBO!" : "NITRO", pad + 10 * u, ny + 22 * u);
  for (let i = 0; i < TURBO_CHARGES; i++) {
    const cx = pad + 100 * u + i * 30 * u, cy = ny + 10 * u;
    const full = i < player.charges;
    roundRect(ctx, cx, cy, 20 * u, 20 * u, 5 * u);
    const cg = ctx.createLinearGradient(0, cy, 0, cy + 20 * u);
    cg.addColorStop(0, full ? "#ffd26a" : "#333"); cg.addColorStop(1, full ? "#e2560e" : "#1a1a1a");
    ctx.fillStyle = cg; ctx.fill();
    ctx.strokeStyle = full ? "#fff1c0" : "#555"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = full ? "#fff" : "#666";
    ctx.font = `bold ${11 * u}px ${FONT_UI}`; ctx.textAlign = "center";
    ctx.fillText("N", cx + 10 * u, cy + 14.5 * u);
    ctx.textAlign = "left";
  }
  roundRect(ctx, pad + 10 * u, ny + 38 * u, nw - 20 * u, 12 * u, 4 * u);
  ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fill();
  if (turbo) {
    roundRect(ctx, pad + 10 * u, ny + 38 * u, (nw - 20 * u) * (player.turboTime / TURBO_TIME), 12 * u, 4 * u);
    const tg = ctx.createLinearGradient(pad, 0, pad + nw, 0);
    tg.addColorStop(0, "#ff5a1a"); tg.addColorStop(1, "#ffe07a");
    ctx.fillStyle = tg; ctx.fill();
  }

  // Abajo a la derecha: minimapa con la forma real de la pista
  const ms = touch ? Math.min(130 * u, W * 0.3, H * 0.3) : Math.min(170 * u, W * 0.3, H * 0.34);
  const mx = W - pad - ms, my = touch ? pad + 88 * u : H - pad - ms;
  panel(mx, my, ms, ms, 14 * u);
  drawTrackShape(trk.plan, mx, my, ms, ms, true);

  // Mensajes
  ctx.textAlign = "center";
  if (game.offroadMsg > 0 && !player.finished) {
    ctx.font = `italic 900 ${26 * u}px ${FONT_TITLE}`;
    ctx.lineWidth = 6 * u; ctx.strokeStyle = "rgba(0,0,0,0.7)";
    ctx.strokeText("¡FUERA DE PISTA!", W / 2, H * 0.34);
    ctx.fillStyle = blink ? "#ff4a2a" : "#ffd23a";
    ctx.fillText("¡FUERA DE PISTA!", W / 2, H * 0.34);
  }
  if (game.padFlash > 0 && !player.finished) {
    ctx.font = `italic 900 ${24 * u}px ${FONT_TITLE}`;
    ctx.lineWidth = 6 * u; ctx.strokeStyle = "rgba(0,0,0,0.7)";
    ctx.strokeText("¡ZONA TURBO!", W / 2, H * 0.3);
    ctx.fillStyle = blink ? "#ffd23a" : "#ff8a1a";
    ctx.fillText("¡ZONA TURBO!", W / 2, H * 0.3);
  }
  if (game.lapMsg > 0 && !player.finished) bigText(game.lapMsgText, game.lap === LAPS ? "#ffd23a" : "#ffffff", 0.7 + Math.min(0.3, (1.6 - game.lapMsg) * 0.6));
  if (game.goTimer > 0) bigText("¡YA!", "#3ddc5a", 1 + (0.9 - game.goTimer) * 0.4);
  if (player.finished) bigText("¡META!", "#ffd23a", 1);
  if (game.touchMode && game.screen === "race") drawTouchControls();
}

function bigText(text, color, scale) {
  const px = Math.min(W * 0.16, 120 * UI) * scale;
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `italic 900 ${px}px ${FONT_TITLE}`;
  ctx.lineJoin = "round";
  ctx.lineWidth = px * 0.14; ctx.strokeStyle = "rgba(0,0,0,0.75)";
  ctx.strokeText(text, W / 2, H * 0.4);
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, H * 0.4);
  ctx.restore();
}

// Trazado de la pista (minimapa y miniaturas del menú)
function drawTrackShape(plan, x, y, w, h, withCars) {
  const b = plan.bounds, pts = plan.shape, n = pts.length / 2;
  const pad = Math.min(w, h) * 0.13;
  const sc = Math.min((w - pad * 2) / Math.max(1, b.maxX - b.minX), (h - pad * 2) / Math.max(1, b.maxY - b.minY));
  const ox = x + w / 2 - ((b.minX + b.maxX) / 2) * sc, oy = y + h / 2 - ((b.minY + b.maxY) / 2) * sc;
  const step = Math.max(1, Math.floor(n / 400));
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  for (let i = 0; i < n; i += step) { const px = ox + pts[i * 2] * sc, py = oy + pts[i * 2 + 1] * sc; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
  ctx.lineTo(ox + pts[(n - 1) * 2] * sc, oy + pts[(n - 1) * 2 + 1] * sc);
  ctx.closePath();
  ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = Math.max(3, 6 * UI * (w / 170)); ctx.stroke();
  ctx.strokeStyle = "#d9dee4"; ctx.lineWidth = Math.max(1.5, 2.8 * UI * (w / 170)); ctx.stroke();
  const at = (i) => { const j = ((i % n) + n) % n; return [ox + pts[j * 2] * sc, oy + pts[j * 2 + 1] * sc]; };
  // zonas de turbo en el minimapa
  ctx.fillStyle = "#ff8a1a";
  for (const pad of plan.pads) {
    const [qx, qy] = at(pad.start - plan.startIndex + 4);
    ctx.beginPath(); ctx.arc(qx, qy, Math.max(1.8, 2.6 * UI * (w / 170)), 0, Math.PI * 2); ctx.fill();
  }
  // salida y meta en el mismo punto
  const [fx, fy] = at(0), fs = Math.max(5, 9 * UI * (w / 170));
  for (let i = 0; i < 4; i++) { ctx.fillStyle = (i === 0 || i === 3) ? "#fff" : "#111"; ctx.fillRect(fx - fs / 2 + (i % 2) * fs / 2, fy - fs / 2 + (i >> 1) * fs / 2, fs / 2, fs / 2); }
  if (!withCars) return;

  p = P(-0.01, -0.215); ctx.fillRect(p[0], p[1], L * 0.19, L * 0.028);

  ctx.beginPath();
  for (let i = 1; i < pts.length - 1; i++) { const q = P(pts[i][0], pts[i][1]); if (i === 1) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]); }

  q = P(0.64, -0.118); ctx.lineTo(q[0], q[1]);
  q = P(0.44, -0.125); ctx.lineTo(q[0], q[1]);
  ctx.closePath();
  const cg = ctx.createLinearGradient(0, cy - L * 0.17, 0, cy - L * 0.12);
  cg.addColorStop(0, "#5a7a9a"); cg.addColorStop(1, "#0a0f16");
  ctx.fillStyle = cg; ctx.fill();
  // franja lateral y toma de aire
  ctx.strokeStyle = "#c8141a"; ctx.lineWidth = Math.max(2, L * 0.006);
  ctx.beginPath(); q = P(0.08, -0.065); ctx.moveTo(q[0], q[1]); q = P(0.9, -0.05); ctx.lineTo(q[0], q[1]); ctx.stroke();
  const ig = ctx.createLinearGradient(0, cy - L * 0.1, 0, cy - L * 0.07);
  ig.addColorStop(0, "#000"); ig.addColorStop(1, "#1e1e24");
  ctx.fillStyle = ig;
  ctx.beginPath();
  q = P(0.29, -0.098); ctx.moveTo(q[0], q[1]); q = P(0.4, -0.1); ctx.lineTo(q[0], q[1]);
  q = P(0.38, -0.075); ctx.lineTo(q[0], q[1]); q = P(0.3, -0.078); ctx.lineTo(q[0], q[1]);
  ctx.closePath(); ctx.fill();
  // pasos de rueda y ruedas con llantas que giran
  for (const u of [0.18, 0.8]) {
    const c = P(u, -0.005), r = L * 0.072;
    ctx.fillStyle = "#020203";
    ctx.beginPath(); ctx.arc(c[0], c[1], r * 1.16, Math.PI, 0); ctx.fill();
  }
  for (const u of [0.18, 0.8]) {
    const c = P(u, -0.005), r = L * 0.072;
    ctx.fillStyle = "#070707"; ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, Math.PI * 2); ctx.fill();
    const wg = ctx.createRadialGradient(c[0] - r * 0.2, c[1] - r * 0.2, 1, c[0], c[1], r * 0.62);
    wg.addColorStop(0, "#e9edf1"); wg.addColorStop(1, "#5a6168");

  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(q[0], q[1], L * 0.08, 0, Math.PI * 2); ctx.fill();
  q = P(0.025, -0.07);

  tg.addColorStop(0, "rgba(255,40,30,0.95)"); tg.addColorStop(1, "rgba(255,40,30,0)");

  ctx.restore();

function drawMiniScene(wi, x, y, w, h) {
  const world = WORLDS[wi], th = buildThemeCached(wi);

  const hz = y + h * 0.5;
  const sg = ctx.createLinearGradient(0, y, 0, hz);

  ctx.fillStyle = "#fff6c8"; ctx.beginPath(); ctx.arc(x + w * 0.78, y + h * 0.18, h * 0.07, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = th.mountains[0];

  for (let px = 0; px <= w; px += 4) ctx.lineTo(x + px, hz - h * 0.2 * ridge(px * 4 + wi * 300, 1.3 + wi, 1));
  ctx.lineTo(x + w, hz); ctx.closePath(); ctx.fill();

    ctx.save(); ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillRect(x, y, w, hz - h * 0.14 - y);
    ctx.restore();
  }
  ctx.fillStyle = th.grass[0]; ctx.fillRect(x, hz, w, h - (hz - y));
  // carretera en perspectiva con líneas que avanzan
  const cx = x + w / 2;
  ctx.fillStyle = th.rumble[0];
  ctx.beginPath(); ctx.moveTo(cx - w * 0.04, hz); ctx.lineTo(cx + w * 0.04, hz); ctx.lineTo(cx + w * 0.5, y + h); ctx.lineTo(cx - w * 0.5, y + h); ctx.fill();
  ctx.fillStyle = th.road[0];
  ctx.beginPath(); ctx.moveTo(cx - w * 0.035, hz); ctx.lineTo(cx + w * 0.035, hz); ctx.lineTo(cx + w * 0.44, y + h); ctx.lineTo(cx - w * 0.44, y + h); ctx.fill();
  ctx.fillStyle = "#f2f2f2";
  for (let k = 0; k < 6; k++) {
    const z = ((k + game.clock * 1.6) % 6) / 6, zz = z * z, yy = hz + (h - (hz - y)) * zz, hh = Math.max(1, 10 * zz * UI), ww = Math.max(1, w * 0.02 * zz + 1);
    ctx.fillRect(cx - ww / 2, yy, ww, hh);

  const dh2 = h * 0.4, dw2 = dh2 * img2.width / img2.height;

  ctx.drawImage(car, cx - cw / 2 + Math.sin(game.clock * 1.5) * w * 0.05, y + h - ch - 2 + Math.sin(game.clock * 30) * 0.6, cw, ch);
  // partículas de la estación
  const parts = { summer: null, autumn: ["#e8821f", "#cf3a1f", "#dcae1c"], winter: ["#ffffff"], spring: ["#ffc0dc", "#ffffff"] }[world.id];
  if (parts) {
    for (let i = 0; i < 18; i++) {
      const px = x + ((i * 53.7 + Math.sin(game.clock + i) * 12 + game.clock * 8) % w);
      const py = y + ((i * 31.1 + game.clock * (20 + (i % 5) * 6)) % h);

      ctx.save(); ctx.translate(px, py); ctx.rotate(game.clock * 2 + i);

      ctx.restore();

  } else {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const gg = ctx.createRadialGradient(x + w * 0.78, y + h * 0.18, 1, x + w * 0.78, y + h * 0.18, h * 0.3);
    gg.addColorStop(0, "rgba(255,240,180,0.5)"); gg.addColorStop(1, "rgba(255,240,180,0)");
    ctx.fillStyle = gg; ctx.fillRect(x, y, w, h);
    ctx.restore();
  }
  ctx.restore();
}

    ctx.font = `bold ${Math.min(14 * u, cw * 0.08)}px ${FONT_UI}`;
    ctx.fillStyle = "#ffd23a";
    ctx.fillText(`${worldCompleted(i)}/10 pistas`, x + cw / 2, y + sh + 8 * u + (ch - sh - 8 * u) * 0.78);
    if (!unlocked) {
      roundRect(ctx, x, y, cw, ch, 12 * u); ctx.fillStyle = "rgba(4,6,16,0.62)"; ctx.fill();
      drawIcon("lock", x + cw / 2, y + sh * 0.5, Math.min(64 * u, cw * 0.35));
      ctx.font = `bold ${Math.min(12 * u, cw * 0.07)}px ${FONT_UI}`; ctx.fillStyle = "#dfe4ea";
      ctx.fillText(`Completa ${WORLDS[i - 1].name}`, x + cw / 2, y + sh * 0.5 + Math.min(48 * u, cw * 0.27));
    }
    game.uiButtons.push({ x, y, w: cw, h: ch, action: () => { game.menuIndex = i; selectWorld(i); } });
  }
  ctx.textAlign = "center";
  ctx.font = `${12 * u}px ${FONT_UI}`; ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("FLECHAS: ELEGIR · ENTER: ENTRAR · ESC: VOLVER", W / 2, H - 16 * u);
}

function drawTrackMenu() {
  menuBackground("#0a1030", "#101c3a");
  const u = UI, wi = game.world, world = WORLDS[wi];
  const narrow = W < 640;
  chromeText(`MUNDO ${wi + 1} · ${world.name}`, W / 2, narrow ? 80 * u : 46 * u, Math.min(40 * u, W * 0.075), "#3f9bff");
  uiButton("◀ MUNDOS", 14 * u, 14 * u, 120 * u, 36 * u, () => goToWorlds());
  const cols = W >= 820 ? 5 : W >= 520 ? 3 : 2;
  game.trackCols = cols;
  const rows = Math.ceil(10 / cols);
  const gap = 12 * u, top = narrow ? 112 * u : 88 * u, bottomSpace = 38 * u;
  let tw = Math.min(190 * u, (W - 32 * u - gap * (cols - 1)) / cols);
  let thh = tw * 1.08;
  const maxH = (H - top - bottomSpace - gap * (rows - 1)) / rows;
  if (thh > maxH) thh = maxH;
  const totalW = cols * tw + (cols - 1) * gap;
  const x0 = (W - totalW) / 2, y0 = top + Math.max(0, (H - top - bottomSpace - (rows * thh + (rows - 1) * gap)) / 2);
  for (let t = 0; t < 10; t++) {
    const col = t % cols, row = Math.floor(t / cols);
    const x = x0 + col * (tw + gap), y = y0 + row * (thh + gap);
    const plan = trackPlan(wi, t);
    const unlocked = isTrackUnlocked(wi, t), focused = game.menuIndex === t;
    roundRect(ctx, x, y, tw, thh, 10 * u);
    const bg = ctx.createLinearGradient(0, y, 0, y + thh);
    bg.addColorStop(0, plan.isGP ? "#2a2010" : "#121b3d"); bg.addColorStop(1, plan.isGP ? "#150f05" : "#0b1128");
    ctx.fillStyle = bg; ctx.fill();
    ctx.lineWidth = focused ? 4 : 1.5;
    ctx.strokeStyle = focused ? "#ffd23a" : plan.isGP ? "#c9a032" : "#2d3a66";
    if (focused) { ctx.shadowColor = "#ffd23a"; ctx.shadowBlur = 14; }
    ctx.stroke(); ctx.shadowBlur = 0;
    const ip = thh * 0.06;
    // número e iconos de hora y clima
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = `italic 900 ${thh * 0.16}px ${FONT_TITLE}`;
    ctx.fillStyle = plan.isGP ? "#ffd23a" : "#ffffff";
    ctx.fillText(String(t + 1), x + ip, y + ip * 0.6);
    const isz = thh * 0.16;
    drawIcon(plan.hour, x + tw - ip - isz * 1.6, y + ip + isz * 0.5, isz);
    drawIcon(plan.weather, x + tw - ip - isz * 0.5, y + ip + isz * 0.5, isz);
    // miniatura del trazado
    drawTrackShape(plan, x + ip, y + thh * 0.2, tw - ip * 2, thh * 0.44, false);
    // nombre, condición y mejor posición
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    fitFont(plan.name, tw - ip * 2, Math.min(14 * u, thh * 0.1), "bold", FONT_UI);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(plan.name, x + tw / 2, y + thh * 0.74);
    fitFont(`${HOUR_LABEL[plan.hour]} · ${WEATHER_LABEL[plan.weather]}`, tw - ip * 2, Math.min(11 * u, thh * 0.08), "", FONT_UI);
    ctx.fillStyle = "#9fb2d4";
    ctx.fillText(`${HOUR_LABEL[plan.hour]} · ${WEATHER_LABEL[plan.weather]}`, x + tw / 2, y + thh * 0.84);
    const best = progress.best[wi * 10 + t];
    ctx.font = `bold ${Math.min(12 * u, thh * 0.085)}px ${FONT_UI}`;
    ctx.fillStyle = best ? (best === 1 ? "#ffd23a" : "#e6ecf2") : "rgba(255,255,255,0.4)";
    ctx.fillText(best ? `MEJOR: ${ordinal(best)}` : plan.isGP ? "GRAN PREMIO" : "—", x + tw / 2, y + thh * 0.95);
    if (!unlocked) {
      roundRect(ctx, x, y, tw, thh, 10 * u); ctx.fillStyle = "rgba(4,6,16,0.66)"; ctx.fill();
      drawIcon("lock", x + tw / 2, y + thh * 0.42, Math.min(52 * u, thh * 0.36));
    }
    game.uiButtons.push({ x, y, w: tw, h: thh, action: () => { game.menuIndex = t; selectTrack(t); } });
  }
  ctx.textAlign = "center";
  ctx.font = `${12 * u}px ${FONT_UI}`; ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("FLECHAS: ELEGIR · ENTER: CORRER · ESC: MUNDOS", W / 2, H - 14 * u);
}

function drawCountdownOverlay() {
  const step = game.countdownStep, p = game.countdownTimer / 0.85;
  if (step <= 0) return;
  const scale = 1 + (1 - p) * 0.5;
  bigText(String(step), step === 1 ? "#ff8a1a" : "#ffd23a", scale);
  ctx.textAlign = "center";
  ctx.font = `bold ${16 * UI}px ${FONT_UI}`;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(`${game.trk.world.name} · ${game.trk.plan.name}`, W / 2, H * 0.56);
  ctx.fillStyle = "#ffd23a";
  ctx.fillText(`${HOUR_LABEL[game.trk.plan.hour]} · ${WEATHER_LABEL[game.trk.plan.weather]} · LÍMITE ${fmtTime(game.trk.plan.timeLimit)}`, W / 2, H * 0.6);
}

function drawPausedOverlay() {
  ctx.fillStyle = "rgba(0,0,10,0.62)";
  ctx.fillRect(0, 0, W, H);
  chromeText("PAUSA", W / 2, H * 0.34, Math.min(90 * UI, W * 0.15));
  const bw = Math.min(260 * UI, W * 0.7), bh = 46 * UI;
  uiButton("CONTINUAR (ESC / P)", W / 2 - bw / 2, H * 0.5, bw, bh, resumeRace, true);
  uiButton("SALIR AL MENÚ (M)", W / 2 - bw / 2, H * 0.5 + bh + 14 * UI, bw, bh, () => goToTracks());
}

function drawResults() {
  const r = game.result, u = UI;
  ctx.fillStyle = "rgba(0,0,10,0.66)";
  ctx.fillRect(0, 0, W, H);
  Confetti.draw();
  let title, rim;
  if (r.champion) { title = "¡CAMPEÓN MUNDIAL!"; rim = "#ffd23a"; }
  else if (r.reason === "timeout") { title = "¡TIEMPO AGOTADO!"; rim = "#ff3a2a"; }
  else if (r.rank === 1) { title = "¡1er LUGAR!"; rim = "#ffd23a"; }
  else if (r.podium) { title = "¡PODIO!"; rim = "#9fd0ff"; }
  else { title = "NO CLASIFICASTE"; rim = "#8a93a8"; }
  const tsz = Math.min(80 * u, W * 0.11);
  chromeText(title, W / 2, H * 0.2, tsz, rim);
  const pw = Math.min(460 * u, W * 0.9), ph = 150 * u, px = W / 2 - pw / 2, py = H * 0.2 + tsz * 0.75;
  panel(px, py, pw, ph, 14 * u);
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.font = `bold ${14 * u}px ${FONT_UI}`; ctx.fillStyle = "#9fb2d4";
  ctx.fillText(`${game.trk.world.name} · ${game.track + 1}/10 · ${game.trk.plan.name}`, W / 2, py + 26 * u);
  ctx.font = `italic 900 ${40 * u}px ${FONT_TITLE}`;
  ctx.fillStyle = r.podium ? "#ffd23a" : "#e6ecf2";
  ctx.fillText(`POSICIÓN: ${ordinal(r.rank)}`, W / 2, py + 72 * u);
  ctx.font = `bold ${18 * u}px ${FONT_MONO}`;
  ctx.fillStyle = "#7fe3ff";
  ctx.fillText(`TIEMPO: ${fmtTime(r.time)}`, W / 2, py + 102 * u);
  fitFont(r.unlockMsg, pw - 24 * u, 14 * u, "bold", FONT_UI);
  ctx.fillStyle = r.podium ? "#7cff6b" : "#ffb08a";
  ctx.fillText(r.unlockMsg, W / 2, py + 132 * u);

  const bh = 46 * u, gap = 12 * u, by = py + ph + 22 * u;
  const buttons = [];
  if (r.next) buttons.push([r.next[1] === 0 ? `IR A ${WORLDS[r.next[0]].name} (ENTER)` : "SIGUIENTE PISTA (ENTER)", resultPrimary, true]);
  else if (r.champion) buttons.push(["PORTADA (ENTER)", resultPrimary, true]);
  buttons.push(["REINTENTAR (R)", () => startRace(game.world, game.track), !r.next && !r.champion]);
  buttons.push(["MENÚ (ESC)", () => goToTracks(), false]);
  const single = W < 620;
  if (single) {
    const bw = Math.min(300 * u, W * 0.8);
    buttons.forEach(([label, fn, prim], i) => uiButton(label, W / 2 - bw / 2, by + i * (bh + gap), bw, bh, fn, prim));
  } else {
    const bw = Math.min(230 * u, (W * 0.9 - gap * (buttons.length - 1)) / buttons.length);
    const total = buttons.length * bw + (buttons.length - 1) * gap;
    buttons.forEach(([label, fn, prim], i) => uiButton(label, W / 2 - total / 2 + i * (bw + gap), by, bw, bh, fn, prim));
  }
}

// ─────────────────────────────── 15. DRAW PRINCIPAL ──────────────────────────
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  game.uiButtons.length = 0;
  switch (game.screen) {
    case "title": drawTitle(); break;
    case "worlds": drawWorldMenu(); break;
    case "tracks": drawTrackMenu(); break;
    case "countdown": drawRaceScene(); drawHUD(); drawCountdownOverlay(); break;
    case "race": drawRaceScene(); drawHUD(); break;
    case "paused": drawRaceScene(); drawHUD(); drawPausedOverlay(); break;
    case "results": drawRaceScene(); drawResults(); break;
    case "options": drawOptionsScreen(); break;
  }
}

// ─────────────────────────────── 16. BUCLE PRINCIPAL ─────────────────────────
let lastTs = null;
function frame(ts) {
  if (lastTs === null) lastTs = ts;
  const rawDt = (ts - lastTs) / 1000;
  const dt = Math.min(rawDt, 0.05);
  lastTs = ts;
  if (rawDt > 0) {
    game.fps = game.fps * 0.95 + (1 / Math.max(rawDt, 0.001)) * 0.05;
    adaptQuality(rawDt);
  }
  for (let i = 0; i < game.timeScale; i++) update(dt);
  draw();
  requestAnimationFrame(frame);
}

// Calidad adaptativa: si durante la carrera no se llega a ~50 fps, baja por pasos
// la resolución interna, la distancia de dibujo y el filtrado de sprites.
function adaptQuality(rawDt) {
  if (game.screen !== "race" || game.timeScale > 1) { game.frameTimes.length = 0; return; }
  game.frameTimes.push(rawDt);
  if (game.frameTimes.length < 90) return;
  const avg = game.frameTimes.reduce((a, b) => a + b, 0) / game.frameTimes.length;
  game.frameTimes.length = 0;
  if (avg > 1 / 50 && qualityLevel < QUALITY_SCALE.length - 1) { qualityLevel++; resizeCanvas(); }
}

// ─────────────────────────────── 17. GANCHOS DE PRUEBA ───────────────────────
// Solo para pruebas automatizadas (Playwright); no afectan al juego normal.
window.TopRacerDebug = {
  start(w, t, skipCountdown) {
    startRace(w, t);
    if (skipCountdown) { game.screen = "race"; game.countdownStep = 0; Sfx.engineStart(); }
  },
  autopilot(on) { game.autopilot = !!on; if (!on) for (const k in keys) keys[k] = false; },
  timeScale(n) { game.timeScale = clamp(n | 0, 1, 8); },
  unlockAll() { progress.unlocked = 40; },
  goto(screen) { game.screen = screen; },
  setTime(t) { game.clock = t; },
  _frame() { update(1 / 60); draw(); },
  state() {
    return {
      screen: game.screen, world: game.world, track: game.track,
      z: player.z, finishZ: game.trk ? game.trk.finishZ : 0, speedMph: Math.round(player.speed / SPEED_SCALE),
      finished: player.finished, rank: game.trk ? currentRank() : 0, timeLeft: game.timeLeft,
      result: game.result, fps: Math.round(game.fps), quality: qualityLevel, dpr: DPR,
      canvas: [canvas.width, canvas.height], css: [W, H], unlocked: progress.unlocked,
      lap: game.trk ? lapOf(game.trk, player.z) : 0, padFlash: game.padFlash,
      padAhead: game.trk ? (() => { const n = game.trk.segments.length, b = Math.floor(player.z / SEGMENT_LENGTH); for (let k = 0; k < 40; k++) if (game.trk.segments[(b + k) % n].pad) return k; return null; })() : null,
    };
  },
};

// ─────────────────────────────── 18. INICIALIZACIÓN ──────────────────────────
function init() {
  progress = loadProgress();
  game.touchMode = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || false;
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", resizeCanvas);
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(() => resizeCanvas()).observe(document.documentElement);
  handleInput();
  canvas.focus();
  requestAnimationFrame(frame);
}

window.addEventListener("load", init);
</script>
