name: Actualizar PERÚ INFORMADO

# Hora de Lima = UTC-5. Siete ejecuciones al día, al minuto 17 para evitar
# la congestión de GitHub al inicio de cada hora:
# 00:17, 06:17, 10:17, 12:17, 15:17, 18:17 y 21:17 (Lima).
# GitHub puede retrasar las ejecuciones; estos horarios son programados.
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 11 * * *"
    - cron: "17 15 * * *"
    - cron: "17 17 * * *"
    - cron: "17 20 * * *"
    - cron: "17 23 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar-coyuntura.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar-coyuntura
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas del actualizador
        run: python -m unittest discover -s coyuntura-peru/scripts -p "test_*.py"

      # Si ningún feed responde o el resultado no pasa las validaciones, el script termina con error
      # y los datos anteriores quedan intactos (no se guarda ni se publica nada).
      - name: Leer feeds y regenerar datos
        run: python coyuntura-peru/scripts/actualizar_noticias.py

      - name: Validar contenido
        run: python coyuntura-peru/scripts/validar_contenido.py

      - name: Guardar cambios en main
        id: guardar
        run: |
          git config user.name "peru-en-claro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add coyuntura-peru/data
          if git diff --cached --quiet; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en los datos."
          else
            git commit -m "chore(coyuntura): actualización automática $(TZ=America/Lima date '+%Y-%m-%d %H:%M') (hora de Lima)"
            for intento in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Intento $intento fallido; se reintenta"; sleep 5
            done
            git diff --quiet origin/main HEAD || { echo "No se pudo guardar en main" >&2; exit 1; }
            echo "cambios=si" >> "$GITHUB_OUTPUT"
          fi

      # Un push hecho con GITHUB_TOKEN no dispara otros flujos, así que se invoca el despliegue de forma explícita.
      - name: Publicar sitio (CI y despliegue)
        if: steps.guardar.outputs.cambios == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-deploy.yml --ref main

      - name: Registrar fallo
        if: failure()
        run: |
          {
            echo "### La actualización falló"
            echo
            echo "Se conservaron los datos anteriores: no se guardó ni se publicó nada nuevo. Revisa los pasos de arriba para ver la causa."
          } >> "$GITHUB_STEP_SUMMARY"
