name: CI y despliegue

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # La actualización automática de Perú en Claro lo invoca con workflow_dispatch y no necesita repetir las pruebas.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    needs: test
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Incluir Perú en Claro en /peru-en-claro/
        run: |
          mkdir -p dist/peru-en-claro
          cp -r coyuntura-peru/. dist/peru-en-claro/
          rm -rf dist/peru-en-claro/scripts dist/peru-en-claro/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # El sitio de GitHub Pages de este repositorio se sirve desde la rama gh-pages (origen "Deploy from a branch").
  # Este job publica Perú en Claro en gh-pages/peru-en-claro/ sin tocar el resto de la rama.
  publicar-peru:
    needs: test
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publicar-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuente
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: sitio
      - name: Copiar Perú en Claro a gh-pages/peru-en-claro/
        run: |
          rm -rf sitio/peru-en-claro
          mkdir -p sitio/peru-en-claro
          cp -r fuente/coyuntura-peru/. sitio/peru-en-claro/
          rm -rf sitio/peru-en-claro/scripts sitio/peru-en-claro/README.md
          touch sitio/.nojekyll
      - name: Publicar en gh-pages
        working-directory: sitio
        run: |
          git config user.name "peru-en-claro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages ya está al día."
          else
            git commit -m "Publicar Perú en Claro ($(TZ=America/Lima date '+%Y-%m-%d %H:%M') hora de Lima)"
            git push origin gh-pages
          fi

  # Solo aplica si el origen de Pages se cambia a "GitHub Actions". Con origen en gh-pages falla sin afectar la publicación anterior.
  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
