name: CI y despliegue

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # La actualización automática de PERÚ INFORMADO lo invoca con workflow_dispatch y no necesita repetir las pruebas.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check coyuntura-peru/assets/newsroom.js && node --check coyuntura-peru/assets/app.js && node --check coyuntura-peru/assets/civic-experience.js && node --check coyuntura-peru/assets/medios.js
      - run: node --test coyuntura-peru/tests/identidad_ciudadana.cjs coyuntura-peru/tests/newsroom.test.cjs coyuntura-peru/tests/medios.test.cjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Comprobar lectura y navegación de PERÚ INFORMADO
        run: |
          node coyuntura-peru/tests/e2e_rutas.cjs
          node coyuntura-peru/tests/newsroom.e2e.cjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    needs: test
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Incluir PERÚ INFORMADO en /peru-en-claro/
        run: |
          mkdir -p dist/peru-en-claro
          cp -r coyuntura-peru/. dist/peru-en-claro/
          rm -rf dist/peru-en-claro/scripts dist/peru-en-claro/tests dist/peru-en-claro/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # El sitio de GitHub Pages de este repositorio se sirve desde la rama gh-pages (origen "Deploy from a branch").
  # Este job publica PERÚ INFORMADO en gh-pages/peru-en-claro/ sin tocar el resto de la rama.
  publicar-peru:
    needs: test
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publicar-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuente
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: sitio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar contenido antes de publicar
        run: python fuente/coyuntura-peru/scripts/validar_contenido.py
      - name: Copiar PERÚ INFORMADO a gh-pages/peru-en-claro/
        run: |
          rm -rf sitio/peru-en-claro
          mkdir -p sitio/peru-en-claro
          cp -r fuente/coyuntura-peru/. sitio/peru-en-claro/
          rm -rf sitio/peru-en-claro/scripts sitio/peru-en-claro/tests sitio/peru-en-claro/README.md
          touch sitio/.nojekyll
          # Versión en las URL de los recursos para que el navegador no use copias viejas
          sed -i "s/__V__/${GITHUB_SHA::10}/g" sitio/peru-en-claro/index.html
      - name: Publicar en gh-pages
        working-directory: sitio
        run: |
          git config user.name "peru-en-claro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages ya está al día."
          else
            git commit -m "Publicar PERÚ INFORMADO ($(TZ=America/Lima date '+%Y-%m-%d %H:%M') hora de Lima)"
            git push origin gh-pages
          fi
